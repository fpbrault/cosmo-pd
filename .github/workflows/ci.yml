name: CI

on:
  pull_request:
  push:
    branches: main

permissions:
  contents: write
  pull-requests: write

jobs:
  semantic-pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run Biome CI
        id: biome-ci
        run: biome ci .

      - name: Run Cargo fmt
        run: bun run lint:fix:cargo || true
        shell: bash

      - name: Check for any formatting changes
        id: check-changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Fail if formatting changes were needed
        if: steps.check-changes.outputs.has-changes == 'true'
        run: exit 1
        shell: bash

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Run unit tests
        run: bun --filter @cosmo/cosmo-pd101 test:unit
        shell: bash

  browser-tests:
    name: Browser Tests (Vitest Browser Mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install Playwright Chromium
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Run browser tests
        run: bun --filter @cosmo/cosmo-pd101 test:browser
        shell: bash

  cosmo-pd101-lib:
    name: Build cosmo-pd101 library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist cache
        id: cosmo-pd101-lib-cache
        uses: actions/cache@v5
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**', 'packages/cosmo-pd101/scripts/gen-bindings.mjs', 'packages/cosmo-synth-engine/src/**', 'packages/cosmo-synth-engine/Cargo.toml', 'packages/cosmo-synth-engine/export_specta_bindings.rs', 'packages/cosmo-pd101-bridge-types/src/**', 'packages/cosmo-pd101-bridge-types/Cargo.toml', 'packages/cosmo-pd101-bridge-types/export_specta_bindings.rs') }}

      - name: Build cosmo-pd101 lib-dist
        if: steps.cosmo-pd101-lib-cache.outputs.cache-hit != 'true'
        run: bun --filter @cosmo/cosmo-pd101 build:lib
        shell: bash

  plugin-webview-unit-tests:
    name: Plugin Webview Unit Tests
    needs: cosmo-pd101-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install plugin webview dependencies
        run: cd packages/cosmo-pd101-plugin/webview && bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist
        id: cosmo-pd101-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**', 'packages/cosmo-pd101/scripts/gen-bindings.mjs', 'packages/cosmo-synth-engine/src/**', 'packages/cosmo-synth-engine/Cargo.toml', 'packages/cosmo-synth-engine/export_specta_bindings.rs', 'packages/cosmo-pd101-bridge-types/src/**', 'packages/cosmo-pd101-bridge-types/Cargo.toml', 'packages/cosmo-pd101-bridge-types/export_specta_bindings.rs') }}

      - name: Build cosmo-pd101 lib-dist
        if: steps.cosmo-pd101-lib-cache.outputs.cache-hit != 'true'
        run: bun --filter @cosmo/cosmo-pd101 build:lib
        shell: bash

      - name: Run plugin webview unit tests
        run: bun --filter @cosmo/cosmo-pd101-plugin test:unit
        shell: bash

  plugin-webview-browser-tests:
    name: Plugin Webview Browser Tests (Vitest Browser Mode)
    needs: cosmo-pd101-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install plugin webview dependencies
        run: cd packages/cosmo-pd101-plugin/webview && bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist
        id: cosmo-pd101-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**', 'packages/cosmo-pd101/scripts/gen-bindings.mjs', 'packages/cosmo-synth-engine/src/**', 'packages/cosmo-synth-engine/Cargo.toml', 'packages/cosmo-synth-engine/export_specta_bindings.rs', 'packages/cosmo-pd101-bridge-types/src/**', 'packages/cosmo-pd101-bridge-types/Cargo.toml', 'packages/cosmo-pd101-bridge-types/export_specta_bindings.rs') }}

      - name: Build cosmo-pd101 lib-dist
        if: steps.cosmo-pd101-lib-cache.outputs.cache-hit != 'true'
        run: bun --filter @cosmo/cosmo-pd101 build:lib
        shell: bash

      - name: Install Playwright Chromium
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Run plugin webview browser tests
        run: bun --filter @cosmo/cosmo-pd101-plugin test:browser
        shell: bash

  plugin-webview-e2e-tests:
    name: Plugin Webview E2E Tests
    needs: cosmo-pd101-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install plugin webview dependencies
        run: cd packages/cosmo-pd101-plugin/webview && bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist
        id: cosmo-pd101-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**', 'packages/cosmo-pd101/scripts/gen-bindings.mjs', 'packages/cosmo-synth-engine/src/**', 'packages/cosmo-synth-engine/Cargo.toml', 'packages/cosmo-synth-engine/export_specta_bindings.rs', 'packages/cosmo-pd101-bridge-types/src/**', 'packages/cosmo-pd101-bridge-types/Cargo.toml', 'packages/cosmo-pd101-bridge-types/export_specta_bindings.rs') }}

      - name: Build cosmo-pd101 lib-dist
        if: steps.cosmo-pd101-lib-cache.outputs.cache-hit != 'true'
        run: bun --filter @cosmo/cosmo-pd101 build:lib
        shell: bash

      - name: Install Playwright Chromium
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Run plugin webview e2e tests
        run: bun --filter @cosmo/cosmo-pd101-plugin test:e2e
        shell: bash

  perf-benchmarks:
    name: Performance Benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            engine:
              - 'packages/cosmo-synth-engine/**'
              - 'scripts/perf-engine-compare.mjs'
              - 'scripts/perf-pr-comment.mjs'
            livepage:
              - 'packages/cosmo-pd101/src/**'
              - 'packages/cosmo-pd101/site/**'
              - 'scripts/perf-livepage-benchmark.mjs'
              - 'scripts/perf-ui-benchmark.mjs'
              - 'scripts/perf-ui-compare.mjs'
              - 'scripts/perf-pr-comment.mjs'
            plugin_webview:
              - 'packages/cosmo-pd101/src/**'
              - 'packages/cosmo-pd101-plugin/webview/**'
              - 'scripts/perf-web-benchmark.mjs'
              - 'scripts/perf-ui-benchmark.mjs'
              - 'scripts/perf-ui-compare.mjs'
              - 'scripts/perf-pr-comment.mjs'
            plugin_native:
              - 'packages/cosmo-synth-engine/**'
              - 'packages/cosmo-pd101-plugin/src/**'
              - 'packages/cosmo-pd101-plugin/Cargo.toml'
              - 'scripts/perf-plugin-compare.mjs'
              - 'scripts/perf-pr-comment.mjs'

      - name: Check for benchmark changes
        if: steps.filter.outputs.engine != 'true' && steps.filter.outputs.livepage != 'true' && steps.filter.outputs.plugin_webview != 'true' && steps.filter.outputs.plugin_native != 'true'
        run: echo "No benchmarked surfaces changed, skipping benchmarks"

      - name: Setup Rust nightly
        if: steps.filter.outputs.engine == 'true' || steps.filter.outputs.plugin_native == 'true'
        uses: dtolnay/rust-toolchain@nightly

      - name: Setup Bun
        if: steps.filter.outputs.engine == 'true' || steps.filter.outputs.livepage == 'true' || steps.filter.outputs.plugin_webview == 'true' || steps.filter.outputs.plugin_native == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.filter.outputs.livepage == 'true' || steps.filter.outputs.plugin_webview == 'true'
        run: bun install
        shell: bash

      - name: Install Playwright Chromium
        if: steps.filter.outputs.livepage == 'true' || steps.filter.outputs.plugin_webview == 'true'
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Install Linux plugin dependencies
        if: steps.filter.outputs.plugin_native == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
        shell: bash

      - name: Benchmark target branch (JSON)
        if: steps.filter.outputs.engine == 'true' || steps.filter.outputs.livepage == 'true' || steps.filter.outputs.plugin_webview == 'true' || steps.filter.outputs.plugin_native == 'true'
        run: |
          mkdir -p target/perf/engine target/perf/ui target/perf/plugin
          base_ref="${{ github.base_ref }}"
          base_dir="$RUNNER_TEMP/cosmo-pd-base"
          git fetch origin "$base_ref" --depth=1
          rm -rf "$base_dir"
          git worktree add --detach "$base_dir" "origin/$base_ref"
          cd "$base_dir"

          if [[ "${RUN_ENGINE}" == "true" ]]; then
            cargo run -p cosmo-synth-engine --release --bin render-bench -- --all --json > "$GITHUB_WORKSPACE/target/perf/engine/base-report.json"
          fi

          if [[ "${RUN_PLUGIN_NATIVE}" == "true" ]]; then
            if grep -q "perf-bench" packages/cosmo-pd101-plugin/Cargo.toml; then
              sudo apt-get update
              sudo apt-get install -y \
                libayatana-appindicator3-dev \
                libgtk-3-dev \
                librsvg2-dev \
                libwebkit2gtk-4.1-dev
              cargo run -p cosmo-pd101-plugin --release --features perf-bench --bin plugin-render-bench -- --json > "$GITHUB_WORKSPACE/target/perf/plugin/base-report.json"
            else
              echo "Native plugin benchmark baseline unavailable on ${base_ref}." > "$GITHUB_WORKSPACE/target/perf/plugin/plugin-compare.md"
            fi
          fi

          if [[ "${RUN_LIVEPAGE}" == "true" || "${RUN_PLUGIN_WEBVIEW}" == "true" ]]; then
            bun install
          fi

          if [[ "${RUN_LIVEPAGE}" == "true" ]]; then
            if grep -R "__czBenchmark" packages/cosmo-pd101 packages/cosmo-pd101/site >/dev/null 2>&1; then
              bun run ./scripts/perf-livepage-benchmark.mjs --out "$GITHUB_WORKSPACE/target/perf/ui/livepage-base-report.json"
            else
              echo "Live page benchmark baseline unavailable on ${base_ref}." > "$GITHUB_WORKSPACE/target/perf/ui/livepage-compare.md"
            fi
          fi

          if [[ "${RUN_PLUGIN_WEBVIEW}" == "true" ]]; then
            if grep -R "__czBenchmark" packages/cosmo-pd101 packages/cosmo-pd101-plugin/webview >/dev/null 2>&1; then
              bun run ./scripts/perf-web-benchmark.mjs --out "$GITHUB_WORKSPACE/target/perf/ui/plugin-webview-base-report.json"
            else
              echo "Plugin webview benchmark baseline unavailable on ${base_ref}." > "$GITHUB_WORKSPACE/target/perf/ui/plugin-webview-compare.md"
            fi
          fi
        env:
          RUN_ENGINE: ${{ steps.filter.outputs.engine }}
          RUN_LIVEPAGE: ${{ steps.filter.outputs.livepage }}
          RUN_PLUGIN_WEBVIEW: ${{ steps.filter.outputs.plugin_webview }}
          RUN_PLUGIN_NATIVE: ${{ steps.filter.outputs.plugin_native }}
        shell: bash

      - name: Benchmark pull request head (JSON)
        if: steps.filter.outputs.engine == 'true' || steps.filter.outputs.livepage == 'true' || steps.filter.outputs.plugin_webview == 'true' || steps.filter.outputs.plugin_native == 'true'
        run: |
          mkdir -p target/perf/engine target/perf/ui target/perf/plugin

          if [[ "${RUN_ENGINE}" == "true" ]]; then
            cargo run -p cosmo-synth-engine --release --bin render-bench -- --all --json > target/perf/engine/pr-report.json
          fi

          if [[ "${RUN_PLUGIN_NATIVE}" == "true" ]]; then
            cargo run -p cosmo-pd101-plugin --release --features perf-bench --bin plugin-render-bench -- --json > target/perf/plugin/pr-report.json
          fi

          if [[ "${RUN_LIVEPAGE}" == "true" ]]; then
            bun run ./scripts/perf-livepage-benchmark.mjs --out target/perf/ui/livepage-pr-report.json
          fi

          if [[ "${RUN_PLUGIN_WEBVIEW}" == "true" ]]; then
            bun run ./scripts/perf-web-benchmark.mjs --out target/perf/ui/plugin-webview-pr-report.json
          fi
        env:
          RUN_ENGINE: ${{ steps.filter.outputs.engine }}
          RUN_LIVEPAGE: ${{ steps.filter.outputs.livepage }}
          RUN_PLUGIN_WEBVIEW: ${{ steps.filter.outputs.plugin_webview }}
          RUN_PLUGIN_NATIVE: ${{ steps.filter.outputs.plugin_native }}
        shell: bash

      - name: Compare engine benchmarks
        id: compare_engine
        if: steps.filter.outputs.engine == 'true'
        continue-on-error: true
        run: |
          bun run ./scripts/perf-engine-compare.mjs \
            target/perf/engine/base-report.json \
            target/perf/engine/pr-report.json \
            --markdown-out target/perf/engine/engine-compare.md \
            --fail-on-regressions
        shell: bash

      - name: Compare live page benchmarks
        id: compare_livepage
        if: steps.filter.outputs.livepage == 'true'
        continue-on-error: true
        run: |
          if [[ ! -f target/perf/ui/livepage-base-report.json ]]; then
            echo "Live page benchmark baseline unavailable on ${{ github.base_ref }}." > target/perf/ui/livepage-compare.md
            exit 0
          fi
          bun run ./scripts/perf-ui-compare.mjs \
            target/perf/ui/livepage-base-report.json \
            target/perf/ui/livepage-pr-report.json \
            --label "Live Page UI" \
            --markdown-out target/perf/ui/livepage-compare.md \
            --fail-on-regressions
        shell: bash

      - name: Compare plugin webview benchmarks
        id: compare_plugin_webview
        if: steps.filter.outputs.plugin_webview == 'true'
        continue-on-error: true
        run: |
          if [[ ! -f target/perf/ui/plugin-webview-base-report.json ]]; then
            echo "Plugin webview benchmark baseline unavailable on ${{ github.base_ref }}." > target/perf/ui/plugin-webview-compare.md
            exit 0
          fi
          bun run ./scripts/perf-ui-compare.mjs \
            target/perf/ui/plugin-webview-base-report.json \
            target/perf/ui/plugin-webview-pr-report.json \
            --label "Plugin Webview UI" \
            --markdown-out target/perf/ui/plugin-webview-compare.md \
            --fail-on-regressions
        shell: bash

      - name: Compare native plugin benchmarks
        id: compare_plugin_native
        if: steps.filter.outputs.plugin_native == 'true'
        continue-on-error: true
        run: |
          if [[ ! -f target/perf/plugin/base-report.json ]]; then
            echo "Native plugin benchmark baseline unavailable on ${{ github.base_ref }}." > target/perf/plugin/plugin-compare.md
            exit 0
          fi
          bun run ./scripts/perf-plugin-compare.mjs \
            target/perf/plugin/base-report.json \
            target/perf/plugin/pr-report.json \
            --markdown-out target/perf/plugin/plugin-compare.md \
            --fail-on-regressions
        shell: bash

      - name: Generate benchmark comment body
        if: steps.filter.outputs.engine == 'true' || steps.filter.outputs.livepage == 'true' || steps.filter.outputs.plugin_webview == 'true' || steps.filter.outputs.plugin_native == 'true'
        run: |
          bun run ./scripts/perf-pr-comment.mjs \
            --engine-compare target/perf/engine/engine-compare.md \
            --livepage-compare target/perf/ui/livepage-compare.md \
            --plugin-webview-compare target/perf/ui/plugin-webview-compare.md \
            --plugin-compare target/perf/plugin/plugin-compare.md \
            --out target/perf/pr-comment.md \
            --base-ref "${{ github.base_ref }}"
        shell: bash

      - name: Upsert PR benchmark comment
        if: steps.filter.outputs.engine == 'true' || steps.filter.outputs.livepage == 'true' || steps.filter.outputs.plugin_webview == 'true' || steps.filter.outputs.plugin_native == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");

            const marker = "<!-- perf-benchmark-comment -->";
            const body = fs.readFileSync("target/perf/pr-comment.md", "utf8");
            const issueNumber = context.payload.pull_request?.number;

            if (!issueNumber) {
              core.info("No pull_request context found; skipping benchmark PR comment.");
              return;
            }

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated benchmark PR comment: ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
              core.info(`Created benchmark PR comment: ${created.data.id}`);
            }

      - name: Fail on benchmark regressions
        if: steps.compare_engine.outcome == 'failure' || steps.compare_livepage.outcome == 'failure' || steps.compare_plugin_webview.outcome == 'failure' || steps.compare_plugin_native.outcome == 'failure'
        run: |
          echo "Performance regression threshold exceeded."
          exit 1
        shell: bash

      - name: Upload benchmark artifact
        if: steps.filter.outputs.engine == 'true' || steps.filter.outputs.livepage == 'true' || steps.filter.outputs.plugin_webview == 'true' || steps.filter.outputs.plugin_native == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: performance-benchmarks
          path: |
            target/perf/**/*.json
            target/perf/**/*.md

  build-plugins:
    name: Build plugins (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            build_cmd: $env:ARCH='universal'; bun run build:plugin:release
          - os: windows-latest
            platform: windows
            build_cmd: bun run build:plugin:release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Run plugin build action
        uses: ./.github/actions/build-plugins
        with:
          buildCmd: ${{ matrix.build_cmd }}

  validate-plugins:
    name: Validate plugins (${{ matrix.platform }})
    needs: build-plugins
    strategy:
      fail-fast: false
      matrix:
        include:
          # - os: macos-latest
          #   platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Run plugin validation action
        uses: ./.github/actions/validate-plugins
        with:
          pluginCrate: cosmo-pd101-plugin
