name: CI

on:
  pull_request:
  push:
    branches: main

permissions:
  contents: write
  pull-requests: write

jobs:
  semantic-pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run Biome CI
        id: biome-ci
        run: biome ci .

      - name: Run Cargo fmt
        run: bun run lint:fix:cargo || true
        shell: bash

      - name: Check for any formatting changes
        id: check-changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Fail if formatting changes were needed
        if: steps.check-changes.outputs.has-changes == 'true'
        run: exit 1
        shell: bash

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Run unit tests
        run: bun --filter @cosmo/cz-explorer test:unit
        shell: bash

  browser-tests:
    name: Browser Tests (Vitest Browser Mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install Playwright Chromium
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Run browser tests
        run: bun --filter @cosmo/cz-explorer test:browser
        shell: bash

  cosmo-pd101-lib:
    name: Build cosmo-pd101 library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist cache
        id: cosmo-pd101-lib-cache
        uses: actions/cache@v4
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**') }}

      - name: Build cosmo-pd101 lib-dist
        if: steps.cosmo-pd101-lib-cache.outputs.cache-hit != 'true'
        run: bun --filter @cosmo/cosmo-pd101 build:lib
        shell: bash

  plugin-webview-unit-tests:
    name: Plugin Webview Unit Tests
    needs: cosmo-pd101-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install plugin webview dependencies
        run: cd packages/cosmo-pd101-plugin/webview && bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist
        uses: actions/cache/restore@v4
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**') }}
          fail-on-cache-miss: true

      - name: Run plugin webview unit tests
        run: bun --filter @cosmo/cosmo-pd101-plugin test:unit
        shell: bash

  plugin-webview-browser-tests:
    name: Plugin Webview Browser Tests (Vitest Browser Mode)
    needs: cosmo-pd101-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install plugin webview dependencies
        run: cd packages/cosmo-pd101-plugin/webview && bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist
        uses: actions/cache/restore@v4
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**') }}
          fail-on-cache-miss: true

      - name: Install Playwright Chromium
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Run plugin webview browser tests
        run: bun --filter @cosmo/cosmo-pd101-plugin test:browser
        shell: bash

  plugin-webview-e2e-tests:
    name: Plugin Webview E2E Tests
    needs: cosmo-pd101-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install plugin webview dependencies
        run: cd packages/cosmo-pd101-plugin/webview && bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist
        uses: actions/cache/restore@v4
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**') }}
          fail-on-cache-miss: true

      - name: Install Playwright Chromium
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Run plugin webview e2e tests
        run: bun --filter @cosmo/cosmo-pd101-plugin test:e2e
        shell: bash

  perf-benchmarks:
    name: Engine Benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'packages/cosmo-synth-engine/**'

      - name: Check for engine changes
        if: steps.filter.outputs.engine != 'true'
        run: echo "No changes to cosmo-synth-engine, skipping benchmarks"

      - name: Setup Rust nightly
        if: steps.filter.outputs.engine == 'true'
        uses: dtolnay/rust-toolchain@nightly

      - name: Benchmark target branch
        if: steps.filter.outputs.engine == 'true'
        run: |
          mkdir -p target/perf/engine
          base_ref="${{ github.base_ref }}"
          base_dir="$RUNNER_TEMP/cosmo-pd-base"
          git fetch origin "$base_ref" --depth=1
          rm -rf "$base_dir"
          git worktree add --detach "$base_dir" "origin/$base_ref"
          cd "$base_dir"
          cargo bench -p cosmo-synth-engine --bench render-bench -- --nocapture | tee "$GITHUB_WORKSPACE/target/perf/engine/base-bench.txt"
        shell: bash

      - name: Seed baseline from target branch
        if: steps.filter.outputs.engine == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: cosmo-synth-engine
          tool: cargo
          output-file-path: target/perf/engine/base-bench.txt
          external-data-json-path: target/perf/engine/baseline.json
          save-data-file: true
          fail-on-alert: false

      - name: Benchmark pull request head
        if: steps.filter.outputs.engine == 'true'
        run: |
          cargo bench -p cosmo-synth-engine --bench render-bench -- --nocapture | tee target/perf/engine/pr-bench.txt
        shell: bash

      - name: Compare PR against target branch
        if: steps.filter.outputs.engine == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: cosmo-synth-engine
          tool: cargo
          output-file-path: target/perf/engine/pr-bench.txt
          external-data-json-path: target/perf/engine/baseline.json
          save-data-file: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          fail-on-alert: true
          comment-always: true
          summary-always: true
          alert-threshold: 108%

      - name: Build benchmark PR comment body
        if: always() && steps.filter.outputs.engine == 'true'
        run: |
          mkdir -p target/perf/engine
          comment_file="target/perf/engine/pr-comment.md"

          compare_md=$(node - <<'NODE'
          const fs = require("node:fs");

          function parseBench(path) {
            if (!fs.existsSync(path)) return new Map();
            const text = fs.readFileSync(path, "utf8");
            const map = new Map();
            const lines = text.split(/\r?\n/);
            const re = /^test\s+(.+?)\s+\.\.\.\s+bench:\s+([0-9,]+\.?[0-9]*)\s+ns\/iter/;
            for (const line of lines) {
              const m = line.match(re);
              if (!m) continue;
              const name = m[1].trim();
              const ns = Number(m[2].replace(/,/g, ""));
              if (Number.isFinite(ns) && ns > 0) {
                map.set(name, ns);
              }
            }
            return map;
          }

          const base = parseBench("target/perf/engine/base-bench.txt");
          const pr = parseBench("target/perf/engine/pr-bench.txt");

          const keys = [...pr.keys()].filter((k) => base.has(k)).sort();
          if (!keys.length) {
            console.log("_Benchmark summary unavailable for this run._");
            process.exit(0);
          }

          const rows = keys.map((name) => {
            const b = base.get(name);
            const c = pr.get(name);
            const deltaPct = ((c - b) / b) * 100;
            return { name, b, c, deltaPct };
          });

          const regressions = rows
            .filter((r) => r.deltaPct > 0)
            .sort((a, b) => b.deltaPct - a.deltaPct)
            .slice(0, 5);
          const improvements = rows
            .filter((r) => r.deltaPct < 0)
            .sort((a, b) => a.deltaPct - b.deltaPct)
            .slice(0, 5);

          const meanDelta = rows.reduce((sum, r) => sum + r.deltaPct, 0) / rows.length;
          const fmtNs = (n) => n.toLocaleString("en-US", { maximumFractionDigits: 2 });
          const fmtPct = (p) => `${p >= 0 ? "+" : ""}${p.toFixed(2)}%`;

          let md = "";
          md += `Compared ${rows.length} shared benchmark case(s).\\n\\n`;
          md += `Mean delta (PR vs base): **${fmtPct(meanDelta)}** (negative is faster).\\n\\n`;

          const section = (title, items) => {
            if (!items.length) return `${title}: none\\n\\n`;
            let out = `${title}\\n\\n`;
            out += "| case | base ns/iter | PR ns/iter | delta |\\n";
            out += "|---|---:|---:|---:|\\n";
            for (const r of items) {
              out += `| ${r.name} | ${fmtNs(r.b)} | ${fmtNs(r.c)} | ${fmtPct(r.deltaPct)} |\\n`;
            }
            out += "\\n";
            return out;
          };

          md += section("Top regressions", regressions);
          md += section("Top improvements", improvements);
          console.log(md.trimEnd());
          NODE
          )

          {
            echo "<!-- perf-benchmark-comment -->"
            echo "## Engine Benchmarks vs \`${{ github.base_ref }}\`"
            echo
            echo "$compare_md"
            echo
            echo "_Updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)_"
          } > "$comment_file"
        shell: bash

      - name: Upsert PR benchmark comment
        if: always() && steps.filter.outputs.engine == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("node:fs");

            const marker = "<!-- perf-benchmark-comment -->";
            const body = fs.readFileSync("target/perf/engine/pr-comment.md", "utf8");
            const issueNumber = context.payload.pull_request?.number;

            if (!issueNumber) {
              core.info("No pull_request context found; skipping benchmark PR comment.");
              return;
            }

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated benchmark PR comment: ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
              core.info(`Created benchmark PR comment: ${created.data.id}`);
            }

      - name: Upload benchmark artifact
        if: steps.filter.outputs.engine == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: engine-benchmark
          path: |
            target/perf/engine/base-bench.txt
            target/perf/engine/pr-bench.txt
            target/perf/engine/baseline.json
            target/perf/engine/pr-comment.md

  build-plugins:
    name: Build plugins (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            build_cmd: $env:ARCH='universal'; bun run build:plugin:release
          - os: windows-latest
            platform: windows
            build_cmd: bun run build:plugin:release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Run plugin build action
        uses: ./.github/actions/build-plugins
        with:
          buildCmd: ${{ matrix.build_cmd }}

  build-desktop:
    name: Build desktop app (${{ matrix.os }})
    if: false # TODO: re-enable when ready
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Run desktop build action
        uses: ./.github/actions/build-desktop

  migrate:
    name: Database Migration
    needs:
      [
        lint,
        unit-tests,
        browser-tests,
        plugin-webview-unit-tests,
        plugin-webview-e2e-tests,
        build-plugins,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run migration action
        uses: ./.github/actions/migrate
