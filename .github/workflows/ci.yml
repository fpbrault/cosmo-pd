name: CI

on:
  pull_request:
  push:
    branches: main

permissions:
  contents: write
  pull-requests: write

jobs:
  semantic-pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run Biome CI
        id: biome-ci
        run: biome ci .

      - name: Run Cargo fmt
        run: bun run lint:fix:cargo || true
        shell: bash

      - name: Check for any formatting changes
        id: check-changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Fail if formatting changes were needed
        if: steps.check-changes.outputs.has-changes == 'true'
        run: exit 1
        shell: bash

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Run unit tests
        run: bun --filter @cosmo/cosmo-pd101 test:unit
        shell: bash

  browser-tests:
    name: Browser Tests (Vitest Browser Mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install Playwright Chromium
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Run browser tests
        run: bun --filter @cosmo/cosmo-pd101 test:browser
        shell: bash

  cosmo-pd101-lib:
    name: Build cosmo-pd101 library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist cache
        id: cosmo-pd101-lib-cache
        uses: actions/cache@v4
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**') }}

      - name: Build cosmo-pd101 lib-dist
        if: steps.cosmo-pd101-lib-cache.outputs.cache-hit != 'true'
        run: bun --filter @cosmo/cosmo-pd101 build:lib
        shell: bash

  plugin-webview-unit-tests:
    name: Plugin Webview Unit Tests
    needs: cosmo-pd101-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install plugin webview dependencies
        run: cd packages/cosmo-pd101-plugin/webview && bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist
        uses: actions/cache/restore@v4
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**') }}
          fail-on-cache-miss: true

      - name: Run plugin webview unit tests
        run: bun --filter @cosmo/cosmo-pd101-plugin test:unit
        shell: bash

  plugin-webview-browser-tests:
    name: Plugin Webview Browser Tests (Vitest Browser Mode)
    needs: cosmo-pd101-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install plugin webview dependencies
        run: cd packages/cosmo-pd101-plugin/webview && bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist
        uses: actions/cache/restore@v4
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**') }}
          fail-on-cache-miss: true

      - name: Install Playwright Chromium
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Run plugin webview browser tests
        run: bun --filter @cosmo/cosmo-pd101-plugin test:browser
        shell: bash

  plugin-webview-e2e-tests:
    name: Plugin Webview E2E Tests
    needs: cosmo-pd101-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install plugin webview dependencies
        run: cd packages/cosmo-pd101-plugin/webview && bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist
        uses: actions/cache/restore@v4
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**') }}
          fail-on-cache-miss: true

      - name: Install Playwright Chromium
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Run plugin webview e2e tests
        run: bun --filter @cosmo/cosmo-pd101-plugin test:e2e
        shell: bash

  perf-benchmarks:
    name: Engine Benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'packages/cosmo-synth-engine/**'

      - name: Check for engine changes
        if: steps.filter.outputs.engine != 'true'
        run: echo "No changes to cosmo-synth-engine, skipping benchmarks"

      - name: Setup Rust nightly
        if: steps.filter.outputs.engine == 'true'
        uses: dtolnay/rust-toolchain@nightly

      - name: Setup Bun
        if: steps.filter.outputs.engine == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Benchmark target branch (JSON)
        if: steps.filter.outputs.engine == 'true'
        run: |
          mkdir -p target/perf/engine
          base_ref="${{ github.base_ref }}"
          base_dir="$RUNNER_TEMP/cosmo-pd-base"
          git fetch origin "$base_ref" --depth=1
          rm -rf "$base_dir"
          git worktree add --detach "$base_dir" "origin/$base_ref"
          cd "$base_dir"
          cargo run -p cosmo-synth-engine --release --bin render-bench -- --all --json > "$GITHUB_WORKSPACE/target/perf/engine/base-report.json"
        shell: bash

      - name: Benchmark pull request head (JSON)
        if: steps.filter.outputs.engine == 'true'
        run: |
          cargo run -p cosmo-synth-engine --release --bin render-bench -- --all --json > target/perf/engine/pr-report.json
        shell: bash

      - name: Compare PR against target branch
        id: compare_engine
        if: steps.filter.outputs.engine == 'true'
        continue-on-error: true
        run: |
          bun run ./scripts/perf-engine-compare.mjs \
            target/perf/engine/base-report.json \
            target/perf/engine/pr-report.json \
            --markdown-out target/perf/engine/engine-compare.md \
            --fail-on-regressions
        shell: bash

      - name: Generate benchmark comment body
        if: steps.filter.outputs.engine == 'true'
        run: |
          bun run ./scripts/perf-pr-comment.mjs \
            --engine-compare target/perf/engine/engine-compare.md \
            --out target/perf/engine/pr-comment.md \
            --base-ref "${{ github.base_ref }}"
        shell: bash

      - name: Upsert PR benchmark comment
        if: steps.filter.outputs.engine == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");

            const marker = "<!-- perf-benchmark-comment -->";
            const body = fs.readFileSync("target/perf/engine/pr-comment.md", "utf8");
            const issueNumber = context.payload.pull_request?.number;

            if (!issueNumber) {
              core.info("No pull_request context found; skipping benchmark PR comment.");
              return;
            }

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated benchmark PR comment: ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
              core.info(`Created benchmark PR comment: ${created.data.id}`);
            }

      - name: Fail on benchmark regressions
        if: steps.filter.outputs.engine == 'true' && steps.compare_engine.outcome == 'failure'
        run: |
          echo "Performance regression threshold exceeded."
          exit 1
        shell: bash

      - name: Upload benchmark artifact
        if: steps.filter.outputs.engine == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: engine-benchmark
          path: |
            target/perf/engine/base-report.json
            target/perf/engine/pr-report.json
            target/perf/engine/engine-compare.md
            target/perf/engine/pr-comment.md

  bridge-benchmarks:
    name: Bridge Benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bridge:
              - 'packages/cz-explorer/public/czSynthWorklet.js'
              - 'packages/cosmo-pd101/src/lib/performance/bridgeBench.ts'
              - 'packages/cosmo-pd101/src/features/synth/engine/**'
              - 'packages/cosmo-pd101/src/features/synth/hooks/*.ts'
              - 'scripts/perf-bridge-*.mjs'

      - name: Check for bridge changes
        if: steps.filter.outputs.bridge != 'true'
        run: echo "No changes to bridge files, skipping benchmarks"

      - name: Setup Rust stable
        if: steps.filter.outputs.bridge == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        if: steps.filter.outputs.bridge == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build WASM engine
        if: steps.filter.outputs.bridge == 'true'
        run: bun run build:engine
        shell: bash

      - name: Build cz-explorer web app
        if: steps.filter.outputs.bridge == 'true'
        run: bun --filter @cosmo/cz-explorer build
        shell: bash

      - name: Run bridge benchmarks
        if: steps.filter.outputs.bridge == 'true'
        run: |
          bun run ./scripts/perf-bridge-web.mjs \
            --host 127.0.0.1 \
            --port 4173 \
            --out target/perf/bridge/pr-report.json
        shell: bash

      - name: Upload bridge benchmark artifact
        if: steps.filter.outputs.bridge == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bridge-benchmark
          path: target/perf/bridge/pr-report.json

  build-plugins:
    name: Build plugins (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            build_cmd: $env:ARCH='universal'; bun run build:plugin:release
          - os: windows-latest
            platform: windows
            build_cmd: bun run build:plugin:release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Run plugin build action
        uses: ./.github/actions/build-plugins
        with:
          buildCmd: ${{ matrix.build_cmd }}

  build-desktop:
    name: Build desktop app (${{ matrix.os }})
    if: false # TODO: re-enable when ready
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Run desktop build action
        uses: ./.github/actions/build-desktop

  migrate:
    name: Database Migration
    needs:
      [
        lint,
        unit-tests,
        browser-tests,
        plugin-webview-unit-tests,
        plugin-webview-e2e-tests,
        build-plugins,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run migration action
        uses: ./.github/actions/migrate
