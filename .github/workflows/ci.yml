name: CI

on:
  pull_request:
  push:
    branches: main

permissions:
  contents: write

jobs:
  semantic-pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run Biome CI
        id: biome-ci
        run: biome ci .

      - name: Run Cargo fmt
        run: bun run lint:fix:cargo || true
        shell: bash

      - name: Check for any formatting changes
        id: check-changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Fail if formatting changes were needed
        if: steps.check-changes.outputs.has-changes == 'true'
        run: exit 1
        shell: bash

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Run unit tests
        run: bun --filter @cosmo/cz-explorer test:unit
        shell: bash

  browser-tests:
    name: Browser Tests (Vitest Browser Mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install Playwright Chromium
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Run browser tests
        run: bun --filter @cosmo/cz-explorer test:browser
        shell: bash

  cosmo-pd101-lib:
    name: Build cosmo-pd101 library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist cache
        id: cosmo-pd101-lib-cache
        uses: actions/cache@v4
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**') }}

      - name: Build cosmo-pd101 lib-dist
        if: steps.cosmo-pd101-lib-cache.outputs.cache-hit != 'true'
        run: bun --filter @cosmo/cosmo-pd101 build:lib
        shell: bash

  plugin-webview-unit-tests:
    name: Plugin Webview Unit Tests
    needs: cosmo-pd101-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install plugin webview dependencies
        run: cd packages/cosmo-pd101-plugin/webview && bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist
        uses: actions/cache/restore@v4
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**') }}
          fail-on-cache-miss: true

      - name: Run plugin webview unit tests
        run: bun --filter @cosmo/cosmo-pd101-plugin test:unit
        shell: bash

  plugin-webview-browser-tests:
    name: Plugin Webview Browser Tests (Vitest Browser Mode)
    needs: cosmo-pd101-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install plugin webview dependencies
        run: cd packages/cosmo-pd101-plugin/webview && bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist
        uses: actions/cache/restore@v4
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**') }}
          fail-on-cache-miss: true

      - name: Install Playwright Chromium
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Run plugin webview browser tests
        run: bun --filter @cosmo/cosmo-pd101-plugin test:browser
        shell: bash

  plugin-webview-e2e-tests:
    name: Plugin Webview E2E Tests
    needs: cosmo-pd101-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install plugin webview dependencies
        run: cd packages/cosmo-pd101-plugin/webview && bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist
        uses: actions/cache/restore@v4
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**') }}
          fail-on-cache-miss: true

      - name: Install Playwright Chromium
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Run plugin webview e2e tests
        run: bun --filter @cosmo/cosmo-pd101-plugin test:e2e
        shell: bash

  perf-benchmarks:
    name: Engine Benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Benchmark target branch
        run: |
          mkdir -p target/perf/engine
          base_ref="${{ github.base_ref }}"
          base_dir="$RUNNER_TEMP/cosmo-pd-base"
          git fetch origin "$base_ref" --depth=1
          rm -rf "$base_dir"
          git worktree add --detach "$base_dir" "origin/$base_ref"
          cd "$base_dir"
          cargo bench -p cosmo-synth-engine --bench render-bench -- --nocapture | tee "$GITHUB_WORKSPACE/target/perf/engine/base-bench.txt"
        shell: bash

      - name: Seed baseline from target branch
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: cosmo-synth-engine
          tool: cargo
          output-file-path: target/perf/engine/base-bench.txt
          external-data-json-path: target/perf/engine/baseline.json
          save-data-file: true
          fail-on-alert: false

      - name: Benchmark pull request head
        run: |
          cargo bench -p cosmo-synth-engine --bench render-bench -- --nocapture | tee target/perf/engine/pr-bench.txt
        shell: bash

      - name: Compare PR against target branch
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: cosmo-synth-engine
          tool: cargo
          output-file-path: target/perf/engine/pr-bench.txt
          external-data-json-path: target/perf/engine/baseline.json
          save-data-file: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          fail-on-alert: true
          comment-always: true
          summary-always: true
          alert-threshold: 108%

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-benchmark
          path: |
            target/perf/engine/base-bench.txt
            target/perf/engine/pr-bench.txt
            target/perf/engine/baseline.json

  build-plugins:
    name: Build plugins (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            build_cmd: $env:ARCH='universal'; bun run build:plugin:release
          - os: windows-latest
            platform: windows
            build_cmd: bun run build:plugin:release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Run plugin build action
        uses: ./.github/actions/build-plugins
        with:
          buildCmd: ${{ matrix.build_cmd }}

  build-desktop:
    name: Build desktop app (${{ matrix.os }})
    if: false # TODO: re-enable when ready
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Run desktop build action
        uses: ./.github/actions/build-desktop

  migrate:
    name: Database Migration
    needs:
      [
        lint,
        unit-tests,
        browser-tests,
        plugin-webview-unit-tests,
        plugin-webview-e2e-tests,
        build-plugins,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run migration action
        uses: ./.github/actions/migrate
