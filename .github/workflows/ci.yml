name: CI

on:
  pull_request:
  push:
    branches: main

permissions:
  contents: write
  pull-requests: write

jobs:
  semantic-pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run Biome CI
        id: biome-ci
        run: biome ci .

      - name: Run Cargo fmt
        run: bun run lint:fix:cargo || true
        shell: bash

      - name: Check for any formatting changes
        id: check-changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Fail if formatting changes were needed
        if: steps.check-changes.outputs.has-changes == 'true'
        run: exit 1
        shell: bash

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify workspace lockfile layout
        run: |
          if [[ -e packages/cosmo-synth-engine/Cargo.lock ]]; then
            echo "::error::Workspace member has a nested Cargo.lock; use the root Cargo.lock instead."
            exit 1
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests (excluding cosmo-pd101-plugin)
        run: cargo test --workspace --exclude cosmo-pd101-plugin

      - name: Run cosmo-pd101-plugin tests (single-threaded)
        run: cargo test -p cosmo-pd101-plugin -- --test-threads=1

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Run unit tests
        run: bun --filter @cosmo/cosmo-pd101 test:unit
        shell: bash

  browser-tests:
    name: Browser Tests (Vitest Browser Mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install Playwright Chromium
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Run browser tests
        run: bun --filter @cosmo/cosmo-pd101 test:browser
        shell: bash

  cosmo-pd101-lib:
    name: Build cosmo-pd101 library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist cache
        id: cosmo-pd101-lib-cache
        uses: actions/cache@v5
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**', 'packages/cosmo-pd101/scripts/gen-bindings.mjs', 'packages/cosmo-synth-engine/src/**', 'packages/cosmo-synth-engine/Cargo.toml', 'packages/cosmo-synth-engine/export_specta_bindings.rs', 'packages/cosmo-pd101-bridge-types/src/**', 'packages/cosmo-pd101-bridge-types/Cargo.toml', 'packages/cosmo-pd101-bridge-types/export_specta_bindings.rs') }}

      - name: Build cosmo-pd101 lib-dist
        if: steps.cosmo-pd101-lib-cache.outputs.cache-hit != 'true'
        run: bun --filter @cosmo/cosmo-pd101 build:lib
        shell: bash

  plugin-webview-unit-tests:
    name: Plugin Webview Unit Tests
    needs: cosmo-pd101-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install plugin webview dependencies
        run: cd packages/cosmo-pd101-plugin/webview && bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist
        id: cosmo-pd101-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**', 'packages/cosmo-pd101/scripts/gen-bindings.mjs', 'packages/cosmo-synth-engine/src/**', 'packages/cosmo-synth-engine/Cargo.toml', 'packages/cosmo-synth-engine/export_specta_bindings.rs', 'packages/cosmo-pd101-bridge-types/src/**', 'packages/cosmo-pd101-bridge-types/Cargo.toml', 'packages/cosmo-pd101-bridge-types/export_specta_bindings.rs') }}

      - name: Build cosmo-pd101 lib-dist
        if: steps.cosmo-pd101-lib-cache.outputs.cache-hit != 'true'
        run: bun --filter @cosmo/cosmo-pd101 build:lib
        shell: bash

      - name: Run plugin webview unit tests
        run: bun --filter @cosmo/cosmo-pd101-plugin test:unit
        shell: bash

  plugin-webview-browser-tests:
    name: Plugin Webview Browser Tests (Vitest Browser Mode)
    needs: cosmo-pd101-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install plugin webview dependencies
        run: cd packages/cosmo-pd101-plugin/webview && bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist
        id: cosmo-pd101-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**', 'packages/cosmo-pd101/scripts/gen-bindings.mjs', 'packages/cosmo-synth-engine/src/**', 'packages/cosmo-synth-engine/Cargo.toml', 'packages/cosmo-synth-engine/export_specta_bindings.rs', 'packages/cosmo-pd101-bridge-types/src/**', 'packages/cosmo-pd101-bridge-types/Cargo.toml', 'packages/cosmo-pd101-bridge-types/export_specta_bindings.rs') }}

      - name: Build cosmo-pd101 lib-dist
        if: steps.cosmo-pd101-lib-cache.outputs.cache-hit != 'true'
        run: bun --filter @cosmo/cosmo-pd101 build:lib
        shell: bash

      - name: Install Playwright Chromium
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Run plugin webview browser tests
        run: bun --filter @cosmo/cosmo-pd101-plugin test:browser
        shell: bash

  plugin-webview-e2e-tests:
    name: Plugin Webview E2E Tests
    needs: cosmo-pd101-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Install plugin webview dependencies
        run: cd packages/cosmo-pd101-plugin/webview && bun install
        shell: bash

      - name: Restore cosmo-pd101 lib-dist
        id: cosmo-pd101-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: packages/cosmo-pd101/lib-dist
          key: cosmo-pd101-lib-dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/cosmo-pd101/package.json', 'packages/cosmo-pd101/tsconfig.json', 'packages/cosmo-pd101/src/**', 'packages/cosmo-pd101/scripts/gen-bindings.mjs', 'packages/cosmo-synth-engine/src/**', 'packages/cosmo-synth-engine/Cargo.toml', 'packages/cosmo-synth-engine/export_specta_bindings.rs', 'packages/cosmo-pd101-bridge-types/src/**', 'packages/cosmo-pd101-bridge-types/Cargo.toml', 'packages/cosmo-pd101-bridge-types/export_specta_bindings.rs') }}

      - name: Build cosmo-pd101 lib-dist
        if: steps.cosmo-pd101-lib-cache.outputs.cache-hit != 'true'
        run: bun --filter @cosmo/cosmo-pd101 build:lib
        shell: bash

      - name: Install Playwright Chromium
        run: bunx playwright install chromium chromium-headless-shell --with-deps
        shell: bash

      - name: Run plugin webview e2e tests
        run: bun --filter @cosmo/cosmo-pd101-plugin test:e2e
        shell: bash

  perf-benchmarks:
    name: Engine Benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            engine:
              - 'packages/cosmo-synth-engine/**'

      - name: Check for engine changes
        if: steps.filter.outputs.engine != 'true'
        run: echo "No changes to cosmo-synth-engine, skipping benchmarks"

      - name: Setup Rust nightly
        if: steps.filter.outputs.engine == 'true'
        uses: dtolnay/rust-toolchain@nightly

      - name: Setup Bun
        if: steps.filter.outputs.engine == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Benchmark target branch (JSON)
        if: steps.filter.outputs.engine == 'true'
        run: |
          mkdir -p target/perf/engine
          base_ref="${{ github.base_ref }}"
          base_dir="$RUNNER_TEMP/cosmo-pd-base"
          git fetch origin "$base_ref" --depth=1
          rm -rf "$base_dir"
          git worktree add --detach "$base_dir" "origin/$base_ref"
          cd "$base_dir"
          cargo run -p cosmo-synth-engine --release --bin render-bench -- --all --json > "$GITHUB_WORKSPACE/target/perf/engine/base-report.json"
        shell: bash

      - name: Benchmark pull request head (JSON)
        if: steps.filter.outputs.engine == 'true'
        run: |
          cargo run -p cosmo-synth-engine --release --bin render-bench -- --all --json > target/perf/engine/pr-report.json
        shell: bash

      - name: Compare PR against target branch
        id: compare_engine
        if: steps.filter.outputs.engine == 'true'
        continue-on-error: true
        run: |
          bun run ./scripts/perf-engine-compare.mjs \
            target/perf/engine/base-report.json \
            target/perf/engine/pr-report.json \
            --markdown-out target/perf/engine/engine-compare.md \
            --fail-on-regressions
        shell: bash

      - name: Generate benchmark comment body
        if: steps.filter.outputs.engine == 'true'
        run: |
          bun run ./scripts/perf-pr-comment.mjs \
            --engine-compare target/perf/engine/engine-compare.md \
            --out target/perf/engine/pr-comment.md \
            --base-ref "${{ github.base_ref }}"
        shell: bash

      - name: Upsert PR benchmark comment
        if: steps.filter.outputs.engine == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");

            const marker = "<!-- perf-benchmark-comment -->";
            const body = fs.readFileSync("target/perf/engine/pr-comment.md", "utf8");
            const issueNumber = context.payload.pull_request?.number;

            if (!issueNumber) {
              core.info("No pull_request context found; skipping benchmark PR comment.");
              return;
            }

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated benchmark PR comment: ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
              core.info(`Created benchmark PR comment: ${created.data.id}`);
            }

      - name: Fail on benchmark regressions
        if: steps.filter.outputs.engine == 'true' && steps.compare_engine.outcome == 'failure'
        run: |
          echo "Performance regression threshold exceeded."
          exit 1
        shell: bash

      - name: Upload benchmark artifact
        if: steps.filter.outputs.engine == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: engine-benchmark
          path: |
            target/perf/engine/base-report.json
            target/perf/engine/pr-report.json
            target/perf/engine/engine-compare.md
            target/perf/engine/pr-comment.md

  ui-perf-benchmarks:
    name: Android Web Display Benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            display:
              - 'packages/cosmo-pd101/src/components/performance/**'
              - 'packages/cosmo-pd101/src/components/panels/analysis/ScopeVisualizationDisplay.tsx'
              - 'packages/cosmo-pd101/site/**'
              - 'scripts/perf-display-*.mjs'
              - 'package.json'
              - 'bun.lock'

      - name: Setup Bun
        if: steps.filter.outputs.display == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.filter.outputs.display == 'true'
        run: bun install --frozen-lockfile
        shell: bash

      - name: Install Playwright Chromium
        if: steps.filter.outputs.display == 'true'
        run: bunx playwright install chromium --with-deps
        shell: bash

      - name: Benchmark target branch
        if: steps.filter.outputs.display == 'true'
        run: |
          mkdir -p target/perf/ui
          base_ref="${{ github.base_ref }}"
          base_dir="$RUNNER_TEMP/cosmo-pd-ui-base"
          git fetch origin "$base_ref" --depth=1
          rm -rf "$base_dir"
          git worktree add --detach "$base_dir" "origin/$base_ref"
          cd "$base_dir"
          bun install --frozen-lockfile
          bun "$GITHUB_WORKSPACE/scripts/perf-display-benchmark.mjs" \
            --out "$GITHUB_WORKSPACE/target/perf/ui/display-base.json" \
            --repeats 3 \
            --warmup-ms 2000 \
            --duration-ms 3000
        shell: bash

      - name: Benchmark pull request head
        if: steps.filter.outputs.display == 'true'
        run: |
          bun run perf:display -- \
            --out target/perf/ui/display-current.json \
            --repeats 3 \
            --warmup-ms 2000 \
            --duration-ms 3000
        shell: bash

      - name: Compare display benchmarks
        id: compare_display
        if: steps.filter.outputs.display == 'true'
        continue-on-error: true
        run: |
          bun run ./scripts/perf-display-compare.mjs \
            target/perf/ui/display-base.json \
            target/perf/ui/display-current.json \
            --markdown-out target/perf/ui/display-compare.md
        shell: bash

      - name: Generate display benchmark comment body
        if: steps.filter.outputs.display == 'true'
        run: |
          bun run ./scripts/perf-pr-comment.mjs \
            --ui-only \
            --marker "<!-- ui-display-benchmark-comment -->" \
            --ui-compare target/perf/ui/display-compare.md \
            --out target/perf/ui/pr-comment.md \
            --base-ref "${{ github.base_ref }}"
        shell: bash

      - name: Upsert display benchmark PR comment
        if: steps.filter.outputs.display == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- ui-display-benchmark-comment -->";
            const body = fs.readFileSync("target/perf/ui/pr-comment.md", "utf8");
            const issueNumber = context.payload.pull_request?.number;

            if (!issueNumber) {
              core.info("No pull_request context found; skipping display benchmark PR comment.");
              return;
            }

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }

      - name: Fail on display benchmark regressions
        if: steps.filter.outputs.display == 'true' && steps.compare_display.outcome == 'failure'
        run: |
          echo "Android web display performance regression threshold exceeded."
          exit 1
        shell: bash

      - name: Upload display benchmark artifacts
        if: steps.filter.outputs.display == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-web-display-benchmark
          path: |
            target/perf/ui/display-base.json
            target/perf/ui/display-current.json
            target/perf/ui/display-compare.md
            target/perf/ui/pr-comment.md

  build-plugins:
    name: Build plugins (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            build_cmd: $env:ARCH='universal'; bun run build:plugin:release
          - os: windows-latest
            platform: windows
            build_cmd: bun run build:plugin:release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Run plugin build action
        uses: ./.github/actions/build-plugins
        with:
          buildCmd: ${{ matrix.build_cmd }}

  validate-plugins:
    name: Validate plugins (${{ matrix.platform }})
    needs: build-plugins
    strategy:
      fail-fast: false
      matrix:
        include:
          # - os: macos-latest
          #   platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Run plugin validation action
        uses: ./.github/actions/validate-plugins
        with:
          pluginCrate: cosmo-pd101-plugin
