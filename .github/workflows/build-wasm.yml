name: Build Generated Artifacts

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/cosmo-synth-engine/**"
      - "packages/cosmo-pd101-bridge-types/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/build-wasm.yml"

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          curl -L https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz | tar xz
          mv wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack ~/.cargo/bin/

      - name: Build WASM
        working-directory: packages/cosmo-synth-engine
        run: |
           wasm-pack build . --release --target no-modules --out-dir ../../cosmo-pd101-plugin/webview/public/cosmo-synth-engine-wasm --features wasm
           rm -f ../../cosmo-pd101-plugin/webview/public/cosmo-synth-engine-wasm/.gitignore

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v7
        with:
           name: cosmo-synth-engine-wasm
           path: packages/cosmo-pd101-plugin/webview/public/cosmo-synth-engine-wasm/


  build-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: Generate Specta TypeScript bindings
        working-directory: packages/cosmo-pd101
        run: bun run gen:bindings:release

      - name: Stale binding check
        working-directory: packages/cosmo-pd101
        run: |
          if ! git diff --exit-code -- src/lib/synth/bindings/ > /dev/null 2>&1; then
            echo "::error::Generated bindings are stale. Run 'bun run gen:bindings' locally and commit the updated files."
            git diff -- src/lib/synth/bindings/
            exit 1
          fi
          echo "Bindings up to date."

      - name: Upload bindings artifact
        uses: actions/upload-artifact@v7
        with:
          name: specta-bindings
          path: packages/cosmo-pd101/src/lib/synth/bindings/
