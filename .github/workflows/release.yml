name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-plugins:
    name: Build and package plugins (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: universal
            build_cmd: bun run build:plugin
            plugin_bundle_path: packages/cosmo-pd101-plugin/target/release/CosmoPd101.vst3
            secondary_bundle_path: packages/cosmo-pd101-plugin/target/release/CosmoPd101.component
            installer_glob: dist/plugin-installers/macos/cosmo-plugins-macos-universal-v*.pkg
            bare_glob: |
              dist/plugin-installers/macos/cosmo-pd101-plugin-macos-universal-v*-vst3.zip
              dist/plugin-installers/macos/cosmo-pd101-plugin-macos-universal-v*-auv2.zip
              dist/plugin-installers/macos/cosmo-pd101-plugin-macos-universal-v*-clap.zip
            artifact_paths: |
              dist/plugin-installers/macos/cosmo-plugins-macos-universal-v*.pkg
              dist/plugin-installers/macos/cosmo-plugins-macos-universal-v*.zip
              dist/plugin-installers/macos/cosmo-pd101-plugin-macos-universal-v*-vst3.zip
              dist/plugin-installers/macos/cosmo-pd101-plugin-macos-universal-v*-auv2.zip
              dist/plugin-installers/macos/cosmo-pd101-plugin-macos-universal-v*-clap.zip
          - os: windows-latest
            platform: windows
            arch: x86_64
            build_cmd: bun run build:plugin
            plugin_bundle_path: packages/cosmo-pd101-plugin/target/release/CosmoPd101.vst3
            secondary_bundle_path: ""
            installer_glob: dist/plugin-installers/windows/*x86_64-win-v*.exe
            bare_glob: dist/plugin-installers/windows/*x86_64-win-v*-vst3.zip
            artifact_paths: |
              dist/plugin-installers/windows/*x86_64-win-v*.exe
              dist/plugin-installers/windows/*x86_64-win-v*-vst3.zip
          - os: windows-11-arm
            platform: windows
            arch: arm64
            build_cmd: bun run build:plugin
            plugin_bundle_path: packages/cosmo-pd101-plugin/target/release/CosmoPd101.vst3
            secondary_bundle_path: ""
            installer_glob: dist/plugin-installers/windows/*aarch64-win-v*.exe
            bare_glob: dist/plugin-installers/windows/*aarch64-win-v*-vst3.zip
            artifact_paths: |
              dist/plugin-installers/windows/*aarch64-win-v*.exe
              dist/plugin-installers/windows/*aarch64-win-v*-vst3.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-truce
        id: cargo-truce-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-truce
          key: cargo-truce-${{ runner.os }}-v1

      - name: Install cargo-truce
        if: steps.cargo-truce-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-truce

      - name: Install dependencies
        run: bun install

      - name: Build plugins
        env:
          ARCH: ${{ matrix.arch }}
        run: ${{ matrix.build_cmd }}

      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: powershell
        run: choco install nsis -y

      - name: Package plugin installers
        run: bun run ./scripts/package-plugin-installers.mjs --platform ${{ matrix.platform }}

      - name: Validate plugin release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -e "${{ matrix.plugin_bundle_path }}"
          if [[ -n "${{ matrix.secondary_bundle_path }}" ]]; then
            test -e "${{ matrix.secondary_bundle_path }}"
          fi
          compgen -G "${{ matrix.installer_glob }}" > /dev/null
          while IFS= read -r pattern; do
            [[ -z "$pattern" ]] && continue
            compgen -G "$pattern" > /dev/null
          done <<'EOF'
          ${{ matrix.bare_glob }}
          EOF

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  # TODO: enable when Gumroad distribution is ready
  # Requires secrets: GUMROAD_ACCESS_TOKEN, GUMROAD_PRODUCT_ID
  upload-plugins-to-gumroad:
    name: Upload plugins to Gumroad
    if: false # disabled — Gumroad distribution not yet configured
    needs: [build-plugins]
    runs-on: ubuntu-latest
    steps:
      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugins-*
          path: plugin-assets
          merge-multiple: true

      - name: Upload plugin files to Gumroad
        shell: bash
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          GUMROAD_PRODUCT_ID: ${{ secrets.GUMROAD_PRODUCT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s globstar

          upload_file() {
            local file="$1"
            local name
            name=$(basename "$file")
            echo "Uploading $name ..."
            curl --fail-with-body -sS \
              -X POST "https://api.gumroad.com/v2/products/${GUMROAD_PRODUCT_ID}/product_files" \
              -H "Authorization: Bearer ${GUMROAD_ACCESS_TOKEN}" \
              -F "file=@${file}" \
              -F "description=${name}"
            echo
          }

          for f in plugin-assets/**/*.pkg \
                    plugin-assets/**/*.zip \
                    plugin-assets/**/*.exe; do
            [[ -e "$f" ]] && upload_file "$f"
          done

  create-release:
    name: Create GitHub release
    needs: [build-plugins]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugins-*
          path: release-assets
          merge-multiple: true

      - name: Validate release assets are present
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar
          
          # Validate plugins are present
          compgen -G "release-assets/**/*.vst3" > /dev/null || true
          compgen -G "release-assets/**/*.pkg" > /dev/null || true
          compgen -G "release-assets/**/*.exe" > /dev/null || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.pkg
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.msi
