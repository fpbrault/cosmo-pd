name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build and package plugins (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-truce
        id: cargo-truce-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-truce
          key: cargo-truce-${{ runner.os }}-v2

      - name: Install cargo-truce
        if: steps.cargo-truce-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-truce

      - name: Install dependencies
        run: bun install

      - name: Build webview
        run: bun run build:web
        working-directory: packages/cosmo-pd101-plugin

      - name: Build plugins
        run: cargo truce build

      - name: Inject webview assets
        run: bun run build:post:assets
        working-directory: packages/cosmo-pd101-plugin

      - name: Install Inno Setup (Windows)
        if: matrix.platform == 'windows'
        run: choco install innosetup --no-progress
        shell: pwsh

      - name: Package plugins (truce)
        run: cargo truce package

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.platform }}
          path: |
            target/dist/*.pkg
            target/dist/*.exe
          if-no-files-found: error

  validate-plugins:
    name: Validate plugins (${{ matrix.platform }})
    needs: build-and-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Run plugin validation action
        uses: ./.github/actions/validate-plugins
        with:
          pluginCrate: cosmo-pd101-plugin

  upload-to-gumroad:
    name: Upload to Gumroad
    needs: [build-and-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugins-*
          path: plugin-assets
          merge-multiple: true

      - name: Upload plugin files to Gumroad
        shell: bash
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          GUMROAD_PRODUCT_ID: ${{ secrets.GUMROAD_PRODUCT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s globstar

          upload_file() {
            local file="$1"
            local name
            name=$(basename "$file")
            local display_name="${name%.pkg}"
            display_name="${display_name%.exe}"
            display_name="${display_name} (${TAG})"

            echo "Uploading $name ..."
            curl --fail-with-body -sS \
              -X POST "https://api.gumroad.com/v2/products/${GUMROAD_PRODUCT_ID}/product_files" \
              -H "Authorization: Bearer ${GUMROAD_ACCESS_TOKEN}" \
              -F "file=@${file}" \
              -F "name=${display_name}"
            echo
          }

          for f in plugin-assets/**/*.pkg plugin-assets/**/*.exe; do
            [[ -e "$f" ]] && upload_file "$f"
          done

  create-release:
    name: Create GitHub release
    needs: [build-and-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugins-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.pkg
            release-assets/**/*.exe
