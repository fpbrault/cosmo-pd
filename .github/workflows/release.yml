name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - exact
      exact_version:
        description: "Exact version for non-bumping releases, e.g. 0.2.0-rc.1"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean
      target_ref:
        description: "Optional commit-ish on the default branch to tag for exact releases"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      version_source: ${{ steps.resolve.outputs.version_source }}
      release_sha: ${{ steps.publish.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: resolve
        run: |
          node scripts/release-workflow.mjs resolve \
            --release-type "${{ inputs.release_type }}" \
            --exact-version "${{ inputs.exact_version }}" \
            --prerelease "${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"

      - name: Resolve release target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          default_branch="${{ github.event.repository.default_branch }}"
          run_ref="${GITHUB_REF_NAME}"
          target_ref="${{ inputs.target_ref }}"

          git fetch origin "${default_branch}" --tags

          if [[ "${run_ref}" != "${default_branch}" ]]; then
            echo "workflow_dispatch releases must be started from ${default_branch}, got ${run_ref}" >&2
            exit 1
          fi

          if [[ -z "${target_ref}" ]]; then
            target_ref="origin/${default_branch}"
          fi

          release_sha="$(git rev-parse "${target_ref}^{commit}")"
          default_branch_sha="$(git rev-parse "origin/${default_branch}^{commit}")"

          if ! git merge-base --is-ancestor "${release_sha}" "${default_branch_sha}"; then
            echo "target_ref must resolve to a commit contained in origin/${default_branch}" >&2
            exit 1
          fi

          if [[ "${{ steps.resolve.outputs.version_source }}" == "bumped" ]]; then
            if [[ -n "${target_ref}" && "${target_ref}" != "origin/${default_branch}" && "${target_ref}" != "${default_branch}" ]]; then
              echo "target_ref is only supported for exact releases; bumped releases always cut from origin/${default_branch}" >&2
              exit 1
            fi
            release_sha="${default_branch_sha}"
          fi

          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not exist
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.resolve.outputs.tag }}"

          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists locally" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists on origin" >&2
            exit 1
          fi

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create bumped release commit
        if: steps.resolve.outputs.version_source == 'bumped'
        shell: bash
        run: |
          set -euo pipefail

          default_branch="${{ github.event.repository.default_branch }}"
          git checkout -B "${default_branch}" "${{ steps.target.outputs.release_sha }}"
          node scripts/bump-version.mjs "${{ steps.resolve.outputs.version }}"
          git add Cargo.toml package.json packages/cosmo-pd101/package.json packages/cosmo-pd101-plugin/package.json packages/cosmo-pd101-plugin-auv3/package.json packages/cosmo-pd101-docs/package.json packages/cosmo-synth-engine/package.json
          git commit -m "chore(release): ${{ steps.resolve.outputs.tag }}"

      - name: Push commit and tag
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          default_branch="${{ github.event.repository.default_branch }}"
          tag="${{ steps.resolve.outputs.tag }}"

          if [[ "${{ steps.resolve.outputs.version_source }}" == "bumped" ]]; then
            release_sha="$(git rev-parse HEAD)"
            git push origin "HEAD:refs/heads/${default_branch}"
          else
            release_sha="${{ steps.target.outputs.release_sha }}"
          fi

          git tag "${tag}" "${release_sha}"
          git push origin "refs/tags/${tag}"

          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

  release-metadata:
    name: Resolve release metadata
    if: always() && (github.event_name != 'push' || github.actor != 'github-actions[bot]') && (github.event_name != 'workflow_dispatch' || needs.prepare-release.result == 'success')
    needs: [prepare-release]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      version_source: ${{ steps.metadata.outputs.version_source }}
      release_ref: ${{ steps.metadata.outputs.release_ref }}
      release_sha: ${{ steps.metadata.outputs.release_sha }}
    steps:
      - name: Compute metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ needs.prepare-release.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ needs.prepare-release.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=${{ needs.prepare-release.outputs.is_prerelease }}" >> "$GITHUB_OUTPUT"
            echo "version_source=${{ needs.prepare-release.outputs.version_source }}" >> "$GITHUB_OUTPUT"
            echo "release_ref=${{ needs.prepare-release.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "release_sha=${{ needs.prepare-release.outputs.release_sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          is_prerelease="false"
          if [[ "${version}" == *-* ]]; then
            is_prerelease="true"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"
          echo "version_source=tag" >> "$GITHUB_OUTPUT"
          echo "release_ref=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  build-and-package:
    name: Build and package plugins (${{ matrix.platform }})
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    needs: [release-metadata]
    env:
      TRUCE_SIGNING_IDENTITY: ${{ secrets.TRUCE_SIGNING_IDENTITY }}
      TRUCE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.TRUCE_INSTALLER_SIGNING_IDENTITY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-metadata.outputs.release_ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-truce
        id: cargo-truce-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-truce
          key: cargo-truce-${{ runner.os }}-v2

      - name: Install cargo-truce
        if: steps.cargo-truce-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-truce

      - name: Install dependencies
        run: bun install

      - name: Build webview
        run: bun run build:web
        working-directory: packages/cosmo-pd101-plugin

      - name: Build plugins
        run: cargo truce build

      - name: Inject webview assets
        run: bun run build:post:assets
        working-directory: packages/cosmo-pd101-plugin

      - name: Install Inno Setup (Windows)
        if: matrix.platform == 'windows'
        run: choco install innosetup --no-progress
        shell: pwsh

      - name: Import certs
        if: matrix.platform == 'macos'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PW" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security default-keychain -s build.keychain

      - name: Store notarization creds
        if: matrix.platform == 'macos'
        run: |
          xcrun notarytool store-credentials TRUCE_NOTARY \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}"

      - name: Package plugins (truce)
        run: cargo truce package

      - name: Rename exact-release artifacts
        if: needs.release-metadata.outputs.version_source == 'exact'
        run: |
          node scripts/release-workflow.mjs rename-artifacts \
            --release-version "${{ needs.release-metadata.outputs.version }}" \
            --dist-dir target/dist

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plugins-${{ matrix.platform }}
          path: |
            target/dist/*.pkg
            target/dist/*.exe
          if-no-files-found: error

  validate-plugins:
    name: Validate plugins (${{ matrix.platform }})
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    needs: [build-and-package, release-metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-metadata.outputs.release_ref }}

      - name: Run plugin validation action
        uses: ./.github/actions/validate-plugins
        with:
          pluginCrate: cosmo-pd101-plugin

  upload-to-gumroad:
    name: Upload to Gumroad
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    needs: [build-and-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download plugin artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: plugins-*
          path: plugin-assets
          merge-multiple: true

      - name: Upload plugin files to Gumroad
        shell: bash
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          GUMROAD_PRODUCT_ID: ${{ secrets.GUMROAD_PRODUCT_ID }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          readonly GUMROAD_API_ROOT="https://api.gumroad.com/v2"
          readonly PART_SIZE_BYTES=104857600

          abort_upload() {
            local upload_id="$1"
            local key="$2"
            local status="accepted"

            while [[ "$status" == "accepted" ]]; do
              local response
              response=$(curl --fail-with-body -sS \
                -X POST "${GUMROAD_API_ROOT}/files/abort" \
                -d "access_token=${GUMROAD_ACCESS_TOKEN}" \
                -d "upload_id=${upload_id}" \
                -d "key=${key}")
              status=$(jq -r '.status' <<<"$response")
              [[ "$status" == "accepted" ]] && sleep 2
            done
          }

          upload_file() {
            local file="$1"
            local name
            local size
            local presign_response
            local upload_id
            local key
            local file_url
            local parts_dir
            local -a split_parts=()
            local -a completion_args=()
            local index=0
            local complete_response

            name=$(basename "$file")
            size=$(stat -c%s "$file")

            echo "Presigning $name ..." >&2
            presign_response=$(curl --fail-with-body -sS \
              -X POST "${GUMROAD_API_ROOT}/files/presign" \
              -d "access_token=${GUMROAD_ACCESS_TOKEN}" \
              -d "filename=${name}" \
              -d "file_size=${size}")

            if [[ "$(jq -r '.success // "false"' <<<"$presign_response")" != "true" ]]; then
              echo "Gumroad presign failed for $name: $presign_response" >&2
              exit 1
            fi

            upload_id=$(jq -r '.upload_id' <<<"$presign_response")
            key=$(jq -r '.key' <<<"$presign_response")
            file_url=$(jq -r '.file_url' <<<"$presign_response")

            if [[ -z "$upload_id" || -z "$key" || -z "$file_url" || "$upload_id" == "null" || "$key" == "null" || "$file_url" == "null" ]]; then
              echo "Gumroad presign response missing required fields for $name" >&2
              exit 1
            fi

            parts_dir=$(mktemp -d)
            split -b "${PART_SIZE_BYTES}" -d -a 6 "$file" "$parts_dir/part-"
            mapfile -t split_parts < <(printf '%s\n' "$parts_dir"/part-* | sort)

            if [[ ${#split_parts[@]} -eq 0 ]]; then
              echo "Failed to split $name into upload parts" >&2
              rm -rf "$parts_dir"
              exit 1
            fi

            while IFS= read -r part; do
              local part_number
              local presigned_url
              local part_file
              local header_file
              local etag

              part_number=$(jq -r '.part_number' <<<"$part")
              presigned_url=$(jq -r '.presigned_url' <<<"$part")
              part_file="${split_parts[$index]:-}"
              header_file=$(mktemp)

              if [[ -z "$part_file" || ! -f "$part_file" ]]; then
                echo "Missing local chunk for part ${part_number} of ${name}" >&2
                rm -f "$header_file"
                abort_upload "$upload_id" "$key" || true
                rm -rf "$parts_dir"
                exit 1
              fi

              echo "Uploading $name part ${part_number} ..." >&2
              if ! curl --fail-with-body -sS \
                -X PUT "$presigned_url" \
                -D "$header_file" \
                --upload-file "$part_file" \
                -o /dev/null; then
                rm -f "$header_file"
                abort_upload "$upload_id" "$key" || true
                rm -rf "$parts_dir"
                exit 1
              fi

              etag=$(awk 'BEGIN { IGNORECASE = 1 } /^ETag:/ { gsub("\r", "", $2); print $2; exit }' "$header_file")
              rm -f "$header_file"

              if [[ -z "$etag" ]]; then
                echo "Missing ETag for part ${part_number} of ${name}" >&2
                abort_upload "$upload_id" "$key" || true
                rm -rf "$parts_dir"
                exit 1
              fi

              completion_args+=(-d "parts[][part_number]=${part_number}")
              completion_args+=(-d "parts[][etag]=${etag}")
              index=$((index + 1))
            done < <(jq -c '.parts[]' <<<"$presign_response")

            echo "Completing $name ..." >&2
            if ! complete_response=$(curl --fail-with-body -sS \
              -X POST "${GUMROAD_API_ROOT}/files/complete" \
              -d "access_token=${GUMROAD_ACCESS_TOKEN}" \
              -d "upload_id=${upload_id}" \
              -d "key=${key}" \
              "${completion_args[@]}"); then
              abort_upload "$upload_id" "$key" || true
              rm -rf "$parts_dir"
              exit 1
            fi

            if [[ "$(jq -r '.success // "false"' <<<"$complete_response")" != "true" ]]; then
              echo "Gumroad complete failed for $name: $complete_response" >&2
              abort_upload "$upload_id" "$key" || true
              rm -rf "$parts_dir"
              exit 1
            fi

            rm -rf "$parts_dir"
            printf '%s\n' "$file_url"
          }

          attach_files() {
            local -a urls=("$@")
            local -a attach_args=()
            local attach_response
            for url in "${urls[@]}"; do
              attach_args+=(-d "files[][url]=${url}")
            done

            echo "Attaching ${#urls[@]} file(s) to product ${GUMROAD_PRODUCT_ID} ..." >&2
            attach_response=$(curl --fail-with-body -sS \
              -X PUT "${GUMROAD_API_ROOT}/products/${GUMROAD_PRODUCT_ID}" \
              -d "access_token=${GUMROAD_ACCESS_TOKEN}" \
              "${attach_args[@]}")

            if [[ "$(jq -r '.success // "false"' <<<"$attach_response")" != "true" ]]; then
              echo "Gumroad attach failed: $attach_response" >&2
              exit 1
            fi

            echo "Attach succeeded for product $(jq -r '.product.permalink // "unknown"' <<<"$attach_response")" >&2
          }

          files=(plugin-assets/**/*.pkg plugin-assets/**/*.exe)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No plugin assets found to upload" >&2
            exit 1
          fi

          uploaded_urls=()
          for f in "${files[@]}"; do
            uploaded_urls+=("$(upload_file "$f")")
          done

          attach_files "${uploaded_urls[@]}"

  create-release:
    name: Create GitHub release
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    needs: [build-and-package, release-metadata]
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-metadata.outputs.tag }}
          name: ${{ needs.release-metadata.outputs.tag }}
          prerelease: ${{ needs.release-metadata.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
