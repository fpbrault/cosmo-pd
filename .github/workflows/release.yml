name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build, validate, and package plugins (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-truce
        id: cargo-truce-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-truce
          key: cargo-truce-${{ runner.os }}-v2

      - name: Install cargo-truce
        if: steps.cargo-truce-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-truce

      - name: Install dependencies
        run: bun install

      - name: Install clap-validator
        run: cargo install --locked --git https://github.com/free-audio/clap-validator clap-validator

      - name: Install pluginval (macOS)
        if: matrix.platform == 'macos'
        run: |
          curl -fsSL -o /tmp/pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -oq /tmp/pluginval.zip -d /tmp/pluginval
          mkdir -p ~/.local/bin
          cp /tmp/pluginval/pluginval.app/Contents/MacOS/pluginval ~/.local/bin/pluginval
          chmod +x ~/.local/bin/pluginval
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pluginval (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $url = "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\pluginval.zip"
          $binDir = "$env:USERPROFILE\.local\bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Expand-Archive -Path "$env:TEMP\pluginval.zip" -DestinationPath $binDir -Force
          "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build webview
        run: bun run build:web
        working-directory: packages/cosmo-pd101-plugin

      - name: Build plugins
        run: cargo truce build

      - name: Inject webview assets
        run: bun run build:post:assets
        working-directory: packages/cosmo-pd101-plugin

      - name: Install plugin for validation (macOS)
        if: matrix.platform == 'macos'
        run: cargo truce install --user --no-build --clap --vst3 --au2 -p cosmo-pd101-plugin

      - name: Install plugin for validation (Windows)
        if: matrix.platform == 'windows'
        run: cargo truce install --user --no-build --clap --vst3 -p cosmo-pd101-plugin

      - name: Validate plugins (macOS)
        if: matrix.platform == 'macos'
        run: cargo truce validate --clap --pluginval --auval -p cosmo-pd101-plugin

      - name: Validate plugins (Windows)
        if: matrix.platform == 'windows'
        run: cargo truce validate --clap --pluginval -p cosmo-pd101-plugin

      - name: Install Inno Setup (Windows)
        if: matrix.platform == 'windows'
        run: choco install innosetup --no-progress
        shell: pwsh

      - name: Package plugins (truce)
        run: cargo truce package

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.platform }}
          path: |
            target/dist/*.pkg
            target/dist/*.exe
          if-no-files-found: error

  upload-to-gumroad:
    name: Upload to Gumroad
    needs: [build-and-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugins-*
          path: plugin-assets
          merge-multiple: true

      - name: Upload plugin files to Gumroad
        shell: bash
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          GUMROAD_PRODUCT_ID: ${{ secrets.GUMROAD_PRODUCT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s globstar

          upload_file() {
            local file="$1"
            local name
            name=$(basename "$file")
            local display_name="${name%.pkg}"
            display_name="${display_name%.exe}"
            display_name="${display_name} (${TAG})"

            echo "Uploading $name ..."
            curl --fail-with-body -sS \
              -X POST "https://api.gumroad.com/v2/products/${GUMROAD_PRODUCT_ID}/product_files" \
              -H "Authorization: Bearer ${GUMROAD_ACCESS_TOKEN}" \
              -F "file=@${file}" \
              -F "name=${display_name}"
            echo
          }

          for f in plugin-assets/**/*.pkg plugin-assets/**/*.exe; do
            [[ -e "$f" ]] && upload_file "$f"
          done

  create-release:
    name: Create GitHub release
    needs: [build-and-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugins-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.pkg
            release-assets/**/*.exe
