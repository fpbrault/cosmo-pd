name: "Validate Plugins"
description: "Build, install, and validate audio plugins using clap-validator, pluginval, and auval"
inputs:
  pluginCrate:
    description: "Cargo crate name of the plugin to validate"
    required: true
  bunVersion:
    description: "Bun version to install"
    required: false
    default: "latest"
runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bunVersion }}

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Bun install cache
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-cache-${{ runner.os }}-

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target

    - name: Install dependencies
      run: bun install
      shell: bash

    - name: Cache cargo-truce
      id: cargo-truce-cache
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/cargo-truce
        key: cargo-truce-${{ runner.os }}-v2

    - name: Install cargo-truce
      if: steps.cargo-truce-cache.outputs.cache-hit != 'true'
      run: cargo install cargo-truce
      shell: bash

    - name: Install clap-validator
      run: cargo install --locked --git https://github.com/free-audio/clap-validator clap-validator
      shell: bash

    - name: Install pluginval (macOS)
      if: runner.os == 'macOS'
      run: |
        curl -fsSL -o /tmp/pluginval.zip \
          https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
        unzip -oq /tmp/pluginval.zip -d /tmp/pluginval
        mkdir -p ~/.local/bin
        cp /tmp/pluginval/pluginval.app/Contents/MacOS/pluginval ~/.local/bin/pluginval
        chmod +x ~/.local/bin/pluginval
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      shell: bash

    - name: Install pluginval (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $url = "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip"
        Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\pluginval.zip"
        $binDir = "$env:USERPROFILE\.local\bin"
        New-Item -ItemType Directory -Force -Path $binDir | Out-Null
        Expand-Archive -Path "$env:TEMP\pluginval.zip" -DestinationPath $binDir -Force
        "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Build webview
      run: bun run build:web
      working-directory: packages/cosmo-pd101-plugin
      shell: bash

    - name: Build plugins
      run: cargo truce build
      shell: bash

    - name: Inject webview assets
      run: bun run build:post:assets
      working-directory: packages/cosmo-pd101-plugin
      shell: bash

    - name: Install plugin
      run: cargo truce install --user -p ${{ inputs.pluginCrate }}
      shell: bash

    - name: Refresh AU component cache (macOS)
      if: runner.os == 'macOS'
      run: killall AudioComponentRegistrar 2>/dev/null || true
      shell: bash

    - name: Validate plugins (macOS)
      if: runner.os == 'macOS'
      run: cargo truce validate --pluginval --auval -p ${{ inputs.pluginCrate }}
      shell: bash

    - name: Validate plugins (Windows)
      if: runner.os == 'Windows'
      run: cargo truce validate --pluginval -p ${{ inputs.pluginCrate }}
      shell: bash
