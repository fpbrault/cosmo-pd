name: "Build Plugins"
description: "Build plugins for a target platform"
inputs:
  buildCmd:
    description: "Plugin build command"
    required: true
  bunVersion:
    description: "Bun version to install"
    required: false
    default: "latest"
runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bunVersion }}

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      run: bun install
      shell: pwsh

    - name: Cache cargo-truce
      id: cargo-truce-cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/cargo-truce
        key: cargo-truce-${{ runner.os }}-v1

    - name: Install cargo-truce
      if: steps.cargo-truce-cache.outputs.cache-hit != 'true'
      run: cargo install cargo-truce
      shell: pwsh

    - name: Build plugins
      run: ${{ inputs.buildCmd }}
      shell: pwsh

    - name: Validate release plugin bundle exists
      run: |
        if (!(Test-Path "target/bundles/Cosmo PD-101.vst3")) {
          Write-Error "Expected release plugin bundle not found at target/bundles/Cosmo PD-101.vst3"
          exit 1
        }
      shell: pwsh
