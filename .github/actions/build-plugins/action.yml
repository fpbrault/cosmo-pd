name: "Build Plugins"
description: "Build plugins for a target platform"
inputs:
  buildCmd:
    description: "Plugin build command"
    required: true
  bunVersion:
    description: "Bun version to install"
    required: false
    default: "latest"
runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bunVersion }}

    - name: Install dependencies
      run: bun install
      shell: pwsh

    - name: Build plugins
      run: ${{ inputs.buildCmd }}
      shell: pwsh

    - name: Validate release plugin bundle exists
      run: |
        if (!(Test-Path "packages/cosmo-pd101-plugin/target/release/CosmoPd101.vst3")) {
          Write-Error "Expected release plugin bundle not found at packages/cosmo-pd101-plugin/target/release/CosmoPd101.vst3"
          exit 1
        }
      shell: pwsh
