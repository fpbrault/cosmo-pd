[package]
name = "cosmo-pd101-plugin"
version = "0.1.0"
edition = "2021"
description = "Cosmo PD-101 synthesizer VST3/CLAP/AUv3 plugin"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["clap", "vst3"]
clap = ["truce/clap"]
vst3 = ["truce/vst3"]
cargo-clippy = []
debug_gui = []

[dependencies]
arc-swap = "1.7"
clap-sys = "0.5"
cosmo-synth-engine = { path = "../cosmo-synth-engine" }
crossbeam-queue = "0.3"
truce = { workspace = true, features = ["clap", "vst3"] }
truce-core = { workspace = true }
truce-clap = { workspace = true }
truce-vst3 = { workspace = true }
wry = { workspace = true }
raw-window-handle = { workspace = true }
rwh_06 = { package = "raw-window-handle", version = "0.6" }
serde_json = "1.0"
libm = "0.2"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
