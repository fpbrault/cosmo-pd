[package]
name = "purr-synth-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable synth runtime, modulation, envelope, and DSP primitives"

[features]
default = ["std"]
std = []
ui = ["std", "dep:cpal", "dep:eframe", "dep:egui_knob", "dep:midir"]

[dependencies]
libm = "0.2"
cpal = { version = "0.15", optional = true }
eframe = { version = "0.31", optional = true }
egui_knob = { version = "=0.3.0", optional = true }
midir = { version = "0.10", optional = true }

[[example]]
name = "minimoog_render"
path = "examples/minimoog_render.rs"
required-features = ["std"]

[[example]]
name = "minimoog_ui"
path = "examples/minimoog_ui.rs"
required-features = ["ui"]
