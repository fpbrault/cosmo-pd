[package]
name = "cosmo-synth-debug"
version = "0.1.0"
edition = "2024"
description = "Minimalist egui debug harness for cosmo-synth-engine"

[[bin]]
name = "cosmo-synth-debug"
path = "src/main.rs"

[dependencies]
cosmo-synth-engine = { path = "../cosmo-synth-engine", features = ["std"] }
eframe = "0.31"
cpal = "0.15"
serde_json = "1"
