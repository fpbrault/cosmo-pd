[package]
name = "cosmo-synth-engine"
version = "0.1.0"
edition = "2021"
description = "Cosmo PD-101 Phase Distortion synthesizer DSP core"

[lib]
crate-type = ["cdylib", "rlib"]

# Specta bindings generator — run with: cargo run --features specta-bindings --bin export-specta-bindings
[[bin]]
name = "export-specta-bindings"
path = "export_specta_bindings.rs"
required-features = ["specta-bindings"]

[[bin]]
name = "render-bench"
path = "src/bin/render-bench.rs"
required-features = ["std"]

[[bench]]
name = "render-bench"
harness = false

[features]
default = ["std"]
std = [
	"serde/std",
	"serde_json",
	"no_denormals",
	"dep:assert_no_alloc",
]
no_denormals = ["dep:no_denormals"]
wasm = ["wasm-bindgen", "web-sys", "getrandom/wasm_js", "serde_json"]
rtsan = ["dep:rtsan-standalone"]
specta-bindings = [
	"dep:specta",
	"dep:specta-serde",
	"dep:specta-typescript",
	"serde_json",
	"std",
]

[dependencies]
serde = { version = "1", features = ["derive"], default-features = false }
serde_json = { version = "1", optional = true }
libm = "0.2"
arrayvec = { version = "0.7", default-features = false }
num_enum = { version = "0.7", default-features = false }
dasp_ring_buffer = { version = "0.11" }
dasp_interpolate = { version = "0.11", features = ["linear"] }
assert_no_alloc = { version = "1", optional = true }
rtsan-standalone = { version = "0.3.0", optional = true }

[dependencies.specta]
version = "=2.0.0-rc.22"
optional = true
features = ["derive"]

[dependencies.specta-serde]
version = "=0.0.9"
optional = true

[dependencies.specta-typescript]
version = "=0.0.9"
optional = true

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.web-sys]
version = "0.3"
optional = true
features = ["console"]

[dependencies.getrandom]
version = "0.4"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
no_denormals = { version = "0.1", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
style = "warn"
correctness = "deny"
suspicious = "warn"
complexity = "warn"
perf = "warn"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
