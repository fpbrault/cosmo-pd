[workspace]
members = [
    "packages/cosmo-synth-engine",
    "packages/cosmo-pd101-plugin",
    "packages/cosmo-pd101-bridge-types",
    "packages/cosmo-pd101-presets",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/fpbrault/cosmo-pd"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
syn = { version = "2", features = [
    "full",
    "parsing",
    "printing",
    "extra-traits",
] }
quote = "1"
proc-macro2 = "1"
truce = { git = "https://github.com/fpbrault/truce.git", rev = "44b1c3095aa8efde21b3d71f25f10f3cd3bee437", default-features = false }
truce-core = { git = "https://github.com/fpbrault/truce.git", rev = "44b1c3095aa8efde21b3d71f25f10f3cd3bee437" }
truce-params = { git = "https://github.com/fpbrault/truce.git", rev = "44b1c3095aa8efde21b3d71f25f10f3cd3bee437" }
truce-clap = { git = "https://github.com/fpbrault/truce.git", rev = "44b1c3095aa8efde21b3d71f25f10f3cd3bee437" }
truce-vst3 = { git = "https://github.com/fpbrault/truce.git", rev = "44b1c3095aa8efde21b3d71f25f10f3cd3bee437" }
truce-au = { git = "https://github.com/fpbrault/truce.git", rev = "44b1c3095aa8efde21b3d71f25f10f3cd3bee437" }
truce-standalone = { git = "https://github.com/fpbrault/truce.git", rev = "44b1c3095aa8efde21b3d71f25f10f3cd3bee437" }
truce-gui = { git = "https://github.com/fpbrault/truce.git", rev = "44b1c3095aa8efde21b3d71f25f10f3cd3bee437" }
truce-build = { git = "https://github.com/fpbrault/truce.git", rev = "44b1c3095aa8efde21b3d71f25f10f3cd3bee437" }
truce-test = { git = "https://github.com/fpbrault/truce.git", rev = "44b1c3095aa8efde21b3d71f25f10f3cd3bee437" }
wry = "0.55.0"
raw-window-handle = "0.6"

[workspace.lints]
clippy.unused_async = "warn"



[profile.release]
lto = "fat"
strip = "symbols"

# Debug builds keep full symbols so lldb/Instruments can attach and show
# meaningful stack traces in the DAW process.
[profile.dev]
strip = "none"
debug = true

[profile.bench]
inherits = "release"
lto = false
strip = "none"
debug = true

# AUv3 static library builds must disable LTO so Xcode's ld can link the objects.
[profile.auv3]
inherits = "release"
lto = false

[profile.shell]
inherits = "release"
