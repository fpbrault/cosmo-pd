[workspace]
members = [
    "packages/cosmo-synth-engine",
    "packages/cosmo-synth-debug",
    "packages/cosmo-pd101-plugin",
    "packages/xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fpbrault/cosmo-pd"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
syn = { version = "2", features = [
    "full",
    "parsing",
    "printing",
    "extra-traits",
] }
quote = "1"
proc-macro2 = "1"
truce = { git = "https://github.com/truce-audio/truce.git", tag = "v0.41.0" }
truce-core = { git = "https://github.com/truce-audio/truce.git", tag = "v0.41.0" }
truce-params = { git = "https://github.com/truce-audio/truce.git", tag = "v0.41.0" }
truce-clap = { git = "https://github.com/truce-audio/truce.git", tag = "v0.41.0" }
truce-vst3 = { git = "https://github.com/truce-audio/truce.git", tag = "v0.41.0" }
truce-vst2 = { git = "https://github.com/truce-audio/truce.git", tag = "v0.41.0" }
truce-lv2 = { git = "https://github.com/truce-audio/truce.git", tag = "v0.41.0" }
truce-au = { path = "vendor/truce-au" }
truce-aax = { git = "https://github.com/truce-audio/truce.git", tag = "v0.41.0" }
truce-standalone = { git = "https://github.com/truce-audio/truce.git", tag = "v0.41.0" }
truce-gui = { git = "https://github.com/truce-audio/truce.git", tag = "v0.41.0" }
truce-build = { git = "https://github.com/truce-audio/truce.git", tag = "v0.41.0" }
truce-test = { git = "https://github.com/truce-audio/truce.git", tag = "v0.41.0" }
truce-shim-types = { path = "vendor/truce-shim-types" }
wry = "0.54.3"
raw-window-handle = "0.5"

[workspace.lints]
clippy.unused_async = "warn"



[profile.release]
lto = "fat"
strip = "symbols"

# Debug builds keep full symbols so lldb/Instruments can attach and show
# meaningful stack traces in the DAW process.
[profile.dev]
strip = "none"
debug = true

[profile.bench]
inherits = "release"
lto = false
strip = "none"
debug = true

# AUv3 static library builds must disable LTO so Xcode's ld can link the objects.
[profile.auv3]
inherits = "release"
lto = false

[profile.shell]
inherits = "release"
