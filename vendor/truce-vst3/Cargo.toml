[package]
name = "truce-vst3"
version = "0.49.22"
repository = "https://github.com/truce-audio/truce"
homepage = "https://github.com/truce-audio/truce"
edition = "2024"
license-file = "../../LICENSE"
rust-version = "1.90"
description = "VST3 format wrapper for truce (C++ shim)"

[dependencies]
truce-core = { workspace = true }
truce-params = { workspace = true }
# Wait-free bounded queue for the host/editor → audio state-load
# handoff so the audio thread is the only one that ever holds
# `&mut Plugin`.
crossbeam-queue = "0.3"

[build-dependencies]
cc = "1"

[lints]
workspace = true
