        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));

        margin: 0 0 8px;

        text-transform: capitalize;
      }
      .chart-wrap {
        height: 260px;
      }
      footer {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      @media (max-width: 640px) {
        body { padding: 12px; }

 a `RenderPlan`, ensuring efficient rendering and modulation handling.\n- Refactored modulation logic to conditionally apply modulations based on active routes, improving performance.\n- Enhanced voice rendering functions to utilize compiled line plans, optimizing audio output.\n- Added tests to validate rendering behavior with and without modulation, ensuring audio integrity.\n- Minor adjustments to SIMD operations for improved clarity and maintainability.\n\n* refactor(engine): rename RenderPlan to CompiledSynthParams\n\n* linting\n\n* chore: remove unused filter parameters from ENGINE_PARAM_UI_META_V1\n\n* test: add unit test for FX slot changes synchronization in CosmoProcessor\nrefactor: update DCO exponential curve comment for clarity\n\n* chore: update cosmo_synth_engine_bg.wasm binary file\n\n* feat: add CZ DAC emulation and enhance synth parameters\n\n- Introduced `CzDacColor` struct for DAC coloration effect, implementing processing logic for CZ-1 emulation.\n- Updated `SynthParams` to include `czDacEnabled` flag, allowing toggling of the CZ DAC effect.\n- Refactored voice rendering to utilize a new `VoiceRenderContext` struct, simplifying parameter passing.\n- Enhanced LFO processing by consolidating related logic into a dedicated function.\n- Improved overall code organization and readability by separating concerns and reducing argument counts in functions.","timestamp":"2026-05-17T11:05:05-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/c91e9c169e95b59983c9ec8922baaece7db95b72","committer":"web-flow"},{"id":"5237d0c9be691c3cd4322ad078a4708f55faa929","message":"fix: add missing bench configuration for render-bench","timestamp":"2026-05-17T12:20:43-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/5237d0c9be691c3cd4322ad078a4708f55faa929","committer":"fpbrault"},{"id":"59d922d644606ee590c1584f65bb270e2046a7b4","message":"fix charts","timestamp":"2026-05-17T12:41:03-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/59d922d644606ee ings\n\n* fix: update plugin bundle paths and improve validation in workflows\n\n* cleanup docs\n\n* window","timestamp":"2026-05-17T17:13:13Z","url":"https://github.com/fpbrault/cosmo-pd/commit/828c25f86a4bff5bc23fc89c96e31ae921e56667","committer":"web-flow"},{"id":"6537d44cd20d1a204e0fdbbd4b27bf52b150d679","message":"refactor: clean up synth UI and engine tests in cosmo-pd101 (#195)\n\nFix cosmo-pd101 tests and lint issues","timestamp":"2026-05-17T23:55:40-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/6537d44cd20d1a204e0fdbbd4b27bf52b150d679","committer":"web-flow"},{"id":"7c51a5c48c3e5423a55c4b5058d0a3001c104376","message":"chore(rust): migrate workspace to edition 2024 (#196)\n\n* chore(rust): migrate workspace to edition 2024\n\n- Bump edition from 2021 to 2024 in all workspace Cargo.toml files\n- cargo fix --edition auto-fixes: #[unsafe(no_mangle)], unsafe_op_in_unsafe_fn,\n  gen→r#gen keyword, expr→expr_2021 fragment specifier\n- Manual fix: replace static mut with OnceLock in terminate_delegate_class()\n- All 70 tests pass, build is warning-free\n\n* refactor(rust): adopt edition 2024 features — if let chains, collapsible ifs, clippy fixes\n\n- Converted 12 nested `if let` / `if` + `if let` patterns to `&& let` chains\n- Hoisted repeated `if let Some(proc)` checks outside match in MIDI handler\n- Fixed `let_and_return` and `explicit_auto_deref` clippy warnings\n- Applied edition 2024 rustfmt (import ordering, brace style, unsafe block wrapping)\n\n* fix(build): wrap unsafe intrinsics in unsafe blocks for edition 2024\n\n- Added unsafe blocks inside unsafe fn bodies in simd/sse2.rs, simd/avx2.rs, simd/wasm_simd.rs\n- Marked extern block in gui.rs as unsafe extern\n- Suppressed unused variable warning for parent on non-macOS","timestamp":"2026-05-18T04:34:00Z","url":"https://github.com/fpbrault/cosmo-pd/commit/7c51a5c48c3e5423a55c4b5058d0a3001c104376","committer":"web-flow"},{"id":"785e48c77bda2770610e3889ace76baa4ccb63b1","message":"feat: Add tempo and LFO sync features to synth engine (#204)\n\n* feat: Add tempo and LFO sync features to synth engine\n\n- Introduced `tempoBpm` parameter to control manual tempo for BPM-synced modulation.\n- Added `LfoRateMode` and `LfoSyncDivision` types to manage LFO rate modes and sync divisions.\n- Updated `SynthState` and `SynthActions` to include tempo and LFO settings.\n- Enhanced `CosmoProcessor` to handle host transport timing for LFO synchronization.\n- Implemented tests to verify LFO behavior with manual and host transport tempos.\n- Updated UI metadata and localization for new parameters.\n\n* feat: Add factory preset count and parameters retrieval functions; refactor LFO module for cleaner code\n\n* linting\n\n* linting","timestamp":"2026-05-18T13:09:42Z","url":"https://github.com/fpbrault/cosmo-pd/commit/785e48c77bda2770610e3889ace76baa4ccb63b1","committer":"web-flow"},{"id":"711a6e2c3ab699f29c47e78aff90ad0ec42c0e07","message":"fix(engine): notes getting stuck with duplicate events (#203)\n\n* feat: Add tempo and LFO sync features to synth engine\n\n- Introduced `tempoBpm` parameter to control manual tempo for BPM-synced modulation.\n- Added `LfoRateMode` and `LfoSyncDivision` types to manage LFO rate modes and sync divisions.\n- Updated `SynthState` and `SynthActions` to include tempo and LFO settings.\n- Enhanced `CosmoProcessor` to handle host transport timing for LFO synchronization.\n- Implemented tests to verify LFO behavior with manual and host transport tempos.\n- Updated UI metadata and localization for new parameters.\n\n* feat: Add factory preset count and parameters retrieval functions; refactor LFO module for cleaner code\n\n* fix: enhance factory preset handling and MIDI event processing\n\n* fix: improve transport state handling and note processing in synthesizer\n\n* fix: remove unnecessary log statements and improve LFO module functionality\n\n* linting\n\n* linting","timestamp":"2026-05-18T13:20:29Z","url":"https://github.com/fpbrault/cosmo-pd/commit/711a6e2c3ab699f29c47e78aff90ad0ec42c0e07","committer":"web-flow"},{"id":"7a3c239bb37f85ad6d16833b26c1952bca0f0b26","message":"chore(deps): update actions/cache action to v5 (#198)\n\nCo-authored-by: renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>","timestamp":"2026-05-18T10:23:08-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/7a3c239bb37f85ad6d16833b26c1952bca0f0b26","committer":"web-flow"},{"id":"a24fa5c20a8ac23c53b3b9ba530f2b70ee78f3e0","message":"feat(synth): add 4 macro knobs with per-parameter modulation assignments (#199)\n\n* feat(synth): add 4 macro knobs with per-parameter modulation assignments\n\nAdds 4 Arturia-style macro knobs (macro1-4, 0-1 range) to the synth panel, positioned above the mini keyboard on the left side.\n\nEach macro knob supports N parameter assignments with per-depth control:\n- MacroAssignment model (macroIndex, destination ModDestination, depth, enabled)\n- Macro contributions computed in getModulatedValue() alongside existing modulation\n- MacroAssignEditor popover for managing assignments per macro\n- Preset serialization/deserialization via gatherState/applyPreset\n\nNo Rust/engine changes required — macros are purely frontend, values flow through existing snapshot pipeline.\n\n* refactor(synth): move macro knobs to engine ModSource, remove frontend assignment model\n\nMacro1-4 are now first-class ModSource variants in the Rust engine,\nso they route through the existing mod matrix. Removes the frontend\nMacroAssignment model and MacroAssignEditor. Macros are set via\ndedicated IPC/WASM calls following the modWheel/aftertouch pattern.\n\n* feat(synth): implement macro knob functionality and UI integration\n\n* fix build\n\n* feat(synth): enhance modulation routing and optimize ModMatrixCache\n\n* linting","timestamp":"2026-05-18T11:54:03-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/a24fa5c20a8ac23c53b3b9ba530f2b70ee78f3e0","committer":"web-flow"},{"id":"2fc58fb5b5d8e78173d4f2003c1d2520aeb9a80d","message":"refactor: move macros to side panel and use modals for settings instead (#205)\n\n* refactor(synth): move macro knobs to engine ModSource, remove frontend assignment model\n\nMacro1-4 are now first-class ModSource variants in the Rust engine,\nso they route through the existing mod matrix. Removes the frontend\nMacroAssignment model and MacroAssignEditor. Macros are set via\ndedicated IPC/WASM calls following the modWheel/aftertouch pattern.\n\n* feat(synth): enhance modulation routing and optimize ModMatrixCache\n\n* Refactor synth UI components and state management\n\n- Removed AsidePanelTab type and related state from synthUiStore.\n- Simplified GlobalVoicePanel and MacroKnobsPanel components.\n- Introduced SynthSidebar for managing global settings and macro label editing.\n- Added GlobalVoiceModal and MacroLabelEditorModal for better UI handling.\n- Updated SynthRenderer to integrate new sidebar and modal components.\n- Adjusted tests to reflect changes in state management and component structure.\n- Cleaned up unused imports and code related to aside panel management.\n\n* cleanup\n\n* cleanup\n\n* refactor(synth): streamline macro label handling and enhance state management\n\n* feat(synth): enhance MacroKnobsPanel styling and integrate macroLabels into synthStore","timestamp":"2026-05-18T14:02:58-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/2fc58fb5b5d8e78173d4f2003c1d2520aeb9a80d","committer":"web-flow"},{"id":"2ed399beeecb6992a1fc0af021406a7c6928de3c","message":"chore: update workflows to build and validate plugins, add validation… (#206)\n\n* chore: update workflows to build and validate plugins, add validation steps and improve caching\n\n* chore: streamline installation of clap-validator and pluginval in workflows\n\n* chore: remove clap-validator installation from workflows and update plugin validation steps\n\n* chore: remove clap option from validation scripts in package.json\n\n* chore: add validate-plugins action and update CI workflows for plugin validation\n\n* chore: update CI and release workflows to remove macOS builds and adjust plugin build scripts","timestamp":"2026-05-18T23:59:12Z","url":"https://github.com/fpbrault/cosmo-pd/commit/2ed399beeecb6992a1fc0af021406a7c6928de3c","committer":"web-flow"},{"id":"7ad34d2b7dda44e586beee06937666f59562e0d9","message":"feat(synth): add MIDI learn with CC mapping and aside panel (#200)\n\n* chore(rust): migrate workspace to edition 2024\n\n- Bump edition from 2021 to 2024 in all workspace Cargo.toml files\n- cargo fix --edition auto-fixes: #[unsafe(no_mangle)], unsafe_op_in_unsafe_fn,\n  gen→r#gen keyword, expr→expr_2021 fragment specifier\n- Manual fix: replace static mut with OnceLock in terminate_delegate_class()\n- All 70 tests pass, build is warning-free\n\n* feat(synth): add MIDI learn with CC mapping and aside panel\n\nMap arbitrary MIDI CCs to any synth parameter via a MIDI Learn aside panel. Right-click bound controls to unlearn. Works in both standalone (Web MIDI API) and plugin (DAW host MIDI via Rust ArrayQueue + idle() eval) runtimes.\n\n- Add midiLearnStore (Zustand + localStorage persist)\n- Add useMidiLearnBindings hook (cz-midi-cc CustomEvent listener)\n- Add MidiLearnPanel with Learn toggle and status\n- Wire SynthParamKnob context menu and learn click\n- Forward all CCs in Rust lib.rs MidiCcQueue and gui.rs idle handler\n- Bridge handlers for nih-plug and AUv3\n\n* Refactor SynthPanelContainer and SynthSidebar components; add MIDI Learn functionality\n\n- Removed unused className prop from SynthPanelContainer.\n- Simplified layout in SynthPanelContainer.\n- Integrated AnimatePresence and motion for MIDI Learn panel in SynthSidebar.\n- Updated SynthSidebarButtons to handle MIDI Learn toggle.\n- Enhanced tests for SynthSidebarButtons to cover MIDI Learn interactions.\n- Refactored MidiLearnPanel to improve binding management and UI.\n- Updated useMidiLearnStore to support multiple MIDI bindings per parameter.\n- Adjusted SynthRenderer to manage MIDI Learn state.\n- Improved MIDI binding logic in useMidiLearnBindings.\n- Cleaned up Rust code for better readability and performance.\n\n* refactor(MidiLearnPanel): remove unused className prop and simplify component structure\n\n* feat: implement MIDI learn functionality across various components\n\n- Added `sectionId` prop to `AlgoControlItem`, `AlgoControlNumber`, `AlgoControlsGroup`, and `AlgoSectionCard` for better control organization.\n- Integrated MIDI learn capabilities in `AlgoControlNumber`, `KnobControl`, `LfoModule`, `ModEnveloppeModule`, and various custom module renderers (Delay, PhaseMod, Tremolo, Vibrato).\n- Created `useMidiLearnTarget` hook to manage MIDI learn state and interactions.\n- Established a registry for MIDI learn targets to facilitate dynamic binding and application of MIDI control changes.\n- Enhanced `MidiLearnPanel` and `MidiLearnStore` to support new MIDI learn functionalities and improve binding management.\n\n* refactor(AlgoControlsGroup): make sectionId optional and set default value\nrefactor(useMidiLearnTarget): define MidiLearnVisualState type and annotate midiLearnState\n\n* fix(AlgoControlNumber): resolve sectionId handling for MIDI learn target key","timestamp":"2026-05-18T20:11:18-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/7ad34d2b7dda44e586beee06937666f59562e0d9","committer":"web-flow"},{"id":"321b75ceeaccc29f093af7f332acd36a3d50d8bb","message":"feat(gumroad): enhance file upload process with multipart support and error handling","timestamp":"2026-05-18T20:41:06-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/321b75ceeaccc29f093af7f332acd36a3d50d8bb","committer":"fpbrault"},{"id":"fa85bc78a4d30360dd8713e9569daecbb5a25974","message":"fix(release): use Gumroad multipart upload and attach flow","timestamp":"2026-05-18T21:11:19-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/fa85bc78a4d30360dd8713e9569daecbb5a25974","committer":"fpbrault"},{"id":"fa85bc78a ions.\n- Created SynthRendererMainPanel to encapsulate main panel functionalities.\n- Implemented SynthRendererOverlays for handling various overlays (audio start, keyboard, modals).\n- Developed SynthRendererTopBar for top-level controls including volume and mode selection.\n- Added drawerHelpers for managing drawer transitions and states.\n- Implemented useAudioLevelMonitor hook for real-time audio level monitoring.\n- Created usePerformanceMetrics hook for performance tracking in audio worklets.\n- Added useDrawerPanelState and useEnvOverrideHandlers hooks for managing UI state and envelope overrides.\n- Updated synthUiStore to support new panel modes.\n- Refactored CSS for consistent theming.\n- Cleaned up unused imports and optimized code structure across various files.\n\n* fix tests\n\n* Refactor and enhance Cosmo PD-101 plugin\n\n- Updated the end-to-end tests for the algo controls plugin to include hover info checks.\n- Introduced a new Playwright configuration file for improved testing setup.\n- Refactored PluginPage component to streamline state management and improve performance.\n- Added cosmoSynthWorklet.js for the new audio worklet processor implementation.\n- Enhanced ControlKnob component to utilize hover info for better user experience.\n- Updated algo control components to use translated labels and descriptions.\n- Improved SynthRenderer and its related components to support audio context and analyser node references.\n- Fixed worklet URL references to align with new naming conventions.\n- Updated WASM glue code comments to reflect changes in worklet file naming.\n\n* feat: implement preset library functionality\n\n- Add shared utilities for preset library management including sorting and editable target checks.\n- Create hooks for importing presets, managing navigation, and handling state within the preset library.\n- Introduce preset manager helpers for building preset entries and managing preset diffs.\n- Implement persistence for preset manager state to maintain user settings and loaded presets.\n- Refactor existing preset manager logic to utilize new helper functions and hooks for improved readability and maintainability.\n\n* fix build","timestamp":"2026-05-20T17:44:21-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/cdcfeba53114d830511b277f786048e054c4c0ec","committer":"web-flow"},{"id":"ab1ebcb69780ea71b64ac601a9f406ce7ad39d5f","message":"chore(deps): update github artifact actions (major) (#213)\n\nchore(deps): update github artifact actions\n\nCo-authored-by: renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>","timestamp":"2026-05-20T20:14:56-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/ab1ebcb69780ea71b64ac601a9f406ce7ad39d5f","committer":"web-flow"},{"id":"92c6cf54654ddfbd43bbaf3a7319693860878aa8","message":"chore(deps): update softprops/action-gh-release action to v3 (#214)\n\nCo-authored-by: renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>\nCo-authored-by: Felix Perron-Brault <fpbrault@gmail.com>","timestamp":"2026-05-20T20:15:30-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/92c6cf54654ddfbd43bbaf3a7319693860878aa8","committer":"web-flow"},{"id":"166ce9d1c2ecdfd4429354faa4bd0668183134a3","message":"feat: add polyphonic aftertouch support (#211)\n\n* feat: add polyphonic aftertouch support\n\n- Implemented handling for polyphonic aftertouch in the audio unit.\n- Added new FFI function `cosmo_pd101_ffi_set_poly_aftertouch` to set polyphonic aftertouch values.\n- Updated the view controller to handle polyphonic aftertouch events from the UI.\n- Modified the Rust backend to process polyphonic aftertouch events and integrate them into the modulation matrix.\n- Enhanced the webview to support sending polyphonic aftertouch events.\n- Updated build scripts to ensure proper feature flags for iOS builds.\n\n* fix build","timestamp":"2026-05-21T13:04:09Z","url":"https://github.com/fpbrault/cosmo-pd/commit/166ce9d1c2ecdfd4429354faa4bd0668183134a3","committer":"web-flow"},{"id":"614ca99501dcf4f08f9fa931cb9711b9bc5412dd","message":"feat(cosmo-pd101): rework modulation targeting ux (#220)\n\n* feat: add polyphonic aftertouch support\n\n- Implemented handling for polyphonic aftertouch in the audio unit.\n- Added new FFI function `cosmo_pd101_ffi_set_poly_aftertouch` to set polyphonic aftertouch values.\n- Updated the view controller to handle polyphonic aftertouch events from the UI.\n- Modified the Rust backend to process polyphonic aftertouch events and integrate them into the modulation matrix.\n- Enhanced the webview to support sending polyphonic aftertouch events.\n- Updated build scripts to ensure proper feature flags for iOS builds.\n\n* fix build\n\n* feat(cosmo-pd101): rework modulation targeting ux","timestamp":"2026-05-21T14:03:06Z","url":"https://github.com/fpbrault/cosmo-pd/commit/614ca99501dcf4f08f9fa931cb9711b9bc5412dd","committer":"web-flow"},{"id":"148f231358977f17e7429060a6465af3ede253f4","message":"fix(pd101): wire vintage tab to cz dac (#221)\n\n* fix(pd101): wire vintage tab to cz dac\n\n* fix(pd101): keep vintage dac toggle global","timestamp":"2026-05-21T15:43:59Z","url":"https://github.com/fpbrault/cosmo-pd/commit/148f231358977f17e7429060a6465af3ede253f4","committer":"web-flow"},{"id":"daa352245354f12e594527df4905d1efcb46155b","message":"fix: adjust vintage dac settings (#222)\n\n* fix(pd101): wire vintage tab to cz dac\n\n* fix(pd101): keep vintage dac toggle global\n\n* fix: update base URL and port in Playwright config files\n\n* refactor(engine): use fixed cz dac trim\n\n* fix(cz_dac): refactor CzDacColor structure and improve processing logic","timestamp":"2026-05-21T20:46:30-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/daa352245354f12e594527df4905d1efcb46155b","committer":"web-flow"},{"id":"8dad462f57e245e08563c34fdaa4c12241fac0aa","message":"refactor: key follow parameters in synth engine (#223)\n\n* fix(pd101): wire vintage tab to cz dac\n\n* fix(pd101): keep vintage dac toggle global\n\n* refactor(engine): use fixed cz dac trim\n\n* Refactor key follow parameters in synth engine\n\n- Removed legacy `keyFollow` field from default presets and replaced it with `dcwKeyFollow` and `dcaKeyFollow`.\n- Updated `DEFAULT_PRESET` to reflect the new key follow structure.\n- Modified envelope processing to utilize the new key follow parameters for both lines.\n- Added tests to ensure correct behavior of the new key follow logic, including its effect on note duration and envelope progression.\n- Adjusted documentation to match the new parameter names and functionality.","timestamp":"2026-05-21T20:56:33-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/8dad462f57e245e08563c34fdaa4c12241fac0aa","committer":"web-flow"},{"id":"c83bb63f6bd92c85aa0420065fb6f6ed404d4298","message":"fix(synth): correct noise modulation routing (#224)\n\n* fix(synth): correct noise modulation routing\n\n* fix(synth): increase noise dcw response\n\n* perf(synth): simplify noise modulation shaping\n\n* update wasm\n\n* perf(synth): speed up noise modulation\n\n* wasm update","timestamp":"2026-05-22T01:17:22Z","url":"https://github.com/fpbrault/cosmo-pd/commit/c83bb63f6bd92c85aa0420065fb6f6ed404d4298","committer":"web-flow"},{"id":"39eeda930e31e9bad4ee1f5c46b9a830d017994d","message":"perf(synth): remove common-path noise overhead (#225)\n\n* update wasm\n\n* perf(synth): remove common-path noise overhead","timestamp":"2026-05-22T01:52:16Z","url":"https://github.com/fpbrault/cosmo-pd/commit/39eeda930e31e9bad4ee1f5c46b9a830d017994d","committer":"web-flow"},{"id":"8953435ae9393a0835e53e15ef125d392a308a6f","message":"fix(deps): update rust crate toml to v1 (#218)\n\nCo-authored-by: renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>","timestamp":"2026-05-22T02:03:49Z","url":"https://github.com/fpbrault/cosmo-pd/commit/8953435ae9393a0835e53e15ef125d392a308a6f","committer":"web-flow"},{"id":"f12eb5b0686bdc24c5ab7b4309929a04565dd3a4","message":"chore: update .gitignore to exclude Xcode project files and retain Cargo config","timestamp":"2026-05-22T16:24:32-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/f12eb5b0686bdc24c5ab7b4309929a04565dd3a4","committer":"fpbrault"},{"id":"81c790565ad87e7cab70a1b416a8536cc8f89595","message":"chore: add sign and notarize setup to release process (#227)\n\n* feat: Enhance AU v2 and v3 support with MIDI 2.0 and SysEx handling\n\n- Added support for MIDI 2.0 channel-voice messages and SysEx events in the AU v3 path.\n- Introduced `AuMidi2Event` structure for handling MIDI 2.0 messages.\n- Updated `AuCallbacks` to include new functions for SysEx output event handling.\n- Implemented SysEx assembler to manage long SysEx payloads across UMP packets.\n- Modified `cb_process` to decode MIDI 2.0 messages and handle SysEx events appropriately.\n- Improved GUI handling by deferring GUI opening until the host has attached the view.\n- Updated vendored `truce-shim-types` to version 0.45.4 with necessary header changes.\n- Ensured consistency between Rust and C header definitions for SysEx pool preallocation.\n\n* remove pbxproj\n\n* chore: add environment variables for signing identities in release workflow\n\n* chore: update release workflow to use secrets for signing identities","timestamp":"2026-05-22T20:54:38Z","url":"https://github.com/fpbrault/cosmo-pd/commit/81c790565ad87e7cab70a1b416a8536cc8f89595","committer":"web-flow"},{"id":"e7503d130f694e2c36483590dd7572d7c2c08b41","message":"update release workflow","timestamp":"2026-05-22T17:22:39-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/e7503d130f694e2c36483590dd7572d7c2c08b41","committer":"fpbrault"},{"id":"65d3881e39cf69d990967dc929772f6602699d94","message":"chore: add caching for Bun install and Rust build artifacts in workflows","timestamp":"2026-05-22T17:31:53-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/65d3881e39cf69d990967dc929772f6602699d94","committer":"fpbrault"},{"id":"80b9f5df1fbde657f2ddd1cc6363646123516ba6","message":"chore: specify shell for renaming exact-release artifacts in release workflow","timestamp":"2026-05-22T17:52:18-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/80b9f5df1fbde657f2ddd1cc6363646123516ba6","committer":"fpbrault"},{"id":"a21dbb79b82ec0680fc08accd786d6a295cb984a","message":"chore: add installer signing identity check to macOS notarization process","timestamp":"2026-05-22T18:12:35-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/a21dbb79b82ec0680fc08accd786d6a295cb984a","committer":"fpbrault"},{"id":"58bd3ea98621bb778aa81cdb4e6dfd6e8906713d","message":"fix: mod not working on detune and fx controls (#228)\n\n* fix mod not working on detune and fx controls\n\n* perf: gate per-sample modulation work behind pre-computed flags\n\nAdd compile-time flags (has_fx_mod_routes, has_line_pitch_routes) to CompiledSynthParams so the per-sample FX modulation and octave/detune modulation code paths are skipped when no routes target those destinations.\n\nBenchmark results (block-size=64, 8 voices, 48kHz):\n- mod-only-sine: +14.6% -> +6.7% (72% regression recovered)\n- mod-heavy:     +13.8% -> +3.0% (92% regression recovered)\n- chants-like:   +11.5% -> +6.7% (73% regression recovered)\n- fx-only-sine:  +0.9%  -> ~0%  (100% regression recovered)\n\n* refactor: simplify modulation parameter application in FX processing\n\n* feat: implement modulation for various effects including Bitcrusher, Chorus, Phaser, and more\n\n* refactor: replace modulated_line_params with per-line apply mods methods\n\nReplaced the fragile modulated_line_params/destination_delta\ndispatch with LineParams::apply_line1_mods/apply_line2_mods\nmethods using direct mod_values[] reads instead of cache.get().\n\nRemoved pre-computed bools has_line_pitch_routes and\nhas_fx_mod_routes along with their dependent methods\nis_line_pitch_destination() and is_fx_destination().\nSwitched apply_env_step_modulation to mod_values[] directly.\n\nAdding a new modulatable line param is now a single-field addition\nin one method rather than touching 3+ files.\n\n* linting\n\n* fix: update dcaBase value in BUILTIN_PRESET_DEFINITIONS for improved sound quality","timestamp":"2026-05-23T12:50:35-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/58bd3ea98621bb778aa81cdb4e6dfd6e8906713d","committer":"web-flow"},{"id":"9f93bd272f273fc4a0152ed80b1cb46158e7cd96","message":"feat: Add sync rate mode and sync division to vibrato, tremolo, and g… (#229)\n\nfeat: Add sync rate mode and sync division to vibrato, tremolo, and grain delay effects\n\n- Implemented rate mode selection (Hz or sync) for vibrato, tremolo, and grain delay effects.\n- Introduced sync division parameter to control timing based on the host tempo.\n- Updated UI components to allow users to switch between Hz and sync modes.\n- Enhanced processing logic to calculate effective rates based on selected mode and transport tempo.\n- Added default values for new parameters in effect presets and parameter structures.\n- Updated relevant tests to cover new functionality and ensure stability.","timestamp":"2026-05-23T19:40:22-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/9f93bd272f273fc4a0152ed80b1cb46158e7cd96","committer":"web-flow"},{"id":"556bc3a3028290c4c5742d18c50ce32da00e079f","message":"refactor: improve fx mod module frames (#231)\n\nRefactor VibratoModuleRenderer: Simplify control handling and integrate FxSlotKnob components; remove unused code and tests","timestamp":"2026-05-23T23:45:49Z","url":"https://github.com/fpbrault/cosmo-pd/commit/556bc3a3028290c4c5742d18c50ce32da00e079f","committer":"web-flow"},{"id":"d1b9359662fb68ee759b8460398b3746df62a2b1","message":"fix: fx modules not always working","timestamp":"2026-05-24T07:29:58-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/d1b9359662fb68ee759b8460398b3746df62a2b1","committer":"fpbrault"},{"id":"88f5f22a1ff3898a5cdcc4e9ba098e6215127586","message":"feat: add new fx (#234)\n\n* feat(cosmo-synth-engine): split new fx from PR 176\n\n* feat: add modulation support for various effects\n\n- Implemented modulation parameters for AutoWah, Flanger, Multimode Filter, Rotary Speaker, and Stereo Widener effects.\n- Added `apply_modulation` methods to respective effect structs to handle modulation values from the modulation matrix.\n- Updated `FxChain` to apply modulated parameters for all active effect slots.\n- Enhanced `params` module to include new modulation destinations for the added effects.\n- Introduced LFO rate mode and sync division options in relevant effect parameters.\n\n* refactor: update FX module configuration and UI integration\n\n- Refactored FX module configuration to utilize a unified metadata structure (FX_UI_META) for better maintainability and consistency.\n- Removed redundant preset titles from various modules to streamline the UI.\n- Updated the SynthSidebarButtons component to integrate modulation target and vintage settings.\n- Enhanced the FxSlotFrame component to reflect changes in effect type selection.\n- Adjusted the ModuleFrame component to remove unnecessary meta props and improve header rendering.\n- Updated tests to align with the new structure and ensure functionality remains intact.\n\n* revert change","timestamp":"2026-05-24T09:37:05-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/88f5f22a1ff3898a5cdcc4e9ba098e6215127586","committer":"web-flow"},{"id":"67de51491a1d5fe8eb0240ce27a2f24b6a5ef9dc","message":"feat: enhance tooltip display for ControlKnob (#232)\n\n* feat: enhance tooltip display for ControlKnob with delayed reveal and positioning\n\n* tests\n\n* linting","timestamp":"2026-05-24T13:44:38Z","url":"https://github.com/fpbrault/cosmo-pd/commit/67de51491a1d5fe8eb0240ce27a2f24b6a5ef9dc","committer":"web-flow"},{"id":"62a61133809f8cb7da380e4dd97133a64c636370","message":"feat: add grain delay module renderer to FX UI meta","timestamp":"2026-05-24T09:45:48-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/62a61133809f8cb7da380e4dd97133a64c636370","committer":"fpbrault"},{"id":"50fdca667c15886621017ed1e48c5d6911384f1a","message":"fix build","timestamp":"2026-05-24T09:59:18-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/50fdca667c15886621017ed1e48c5d6911384f1a","committer":"fpbrault"},{"id":"4c19315e0a6c6e53bd0f821a79c0475a7d58ee71","message":"feat: update audio effect presets and processing parameters\n\n- Refactored audio effect presets to use required parameter types for better type safety.\n- Added new parameters such as time_mode and sync_division to delay, grain delay, and tremolo effects.\n- Updated various presets to include new parameters and adjusted values for consistency.\n- Enhanced the Rust backend to accommodate new parameters in the effect processing logic.","timestamp":"2026-05-24T10:24:03-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/4c19315e0a6c6e53bd0f821a79c0475a7d58ee71","committer":"fpbrault"},{"id":"d66ebff63a027296bcee07c5ab0b5b595bbc61bd","message":"fix build","timestamp":"2026-05-24T10:25:23-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/d66ebff63a027296bcee07c5ab0b5b595bbc61bd","committer":"fpbrault"},{"id":"9910724a37f31cc317809d2967b6c83ac202f28a","message":"test(cosmo-pd101): Add unit tests for various components and hooks in the synth module (#235)\n\n* Add unit tests for various components and hooks in the synth module\n\n- Implement tests for `useDrawerPanelState` to verify drawer state management.\n- Create tests for `useEnvOverrideHandlers` to ensure correct routing of environment changes.\n- Add tests for `ModMatrixContext` to validate context usage and provider functionality.\n- Replace old `SynthParamController.test.ts` with a new comprehensive test suite for `SynthParamController`.\n- Introduce tests for MIDI learning hooks: `useMidiLearnBindings` and `useMidiLearnTarget`.\n- Add tests for modulation target hooks: `useModulationTarget` and `useSynthParamsToWorklet`.\n- Implement tests for the MIDI l               y: {
                title: { display: true, text: group.unit },
                beginAtZero: true,
              },
            },
            onClick(_event, elements) {
              if (!elements.length) {
                return;
              }
              const idx = elements[0].index;
              const url = payload.commitDetails[idx]?.url;
              if (url) {
                window.open(url, "_blank", "noopener");
              }
            },
          },
        });
      });
    </script>
  </body>
</html>
