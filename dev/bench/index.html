    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fc;
        --panel: #ffffff;
        --text: #121722;
        --muted: #566174;
        --border: #d5ddea;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        font-family: "Segoe UI", "Inter", sans-serif;
        background: radial-gradient(circle at top right, #ebf0ff 0%, var(--bg) 40%);
        color: var(--text);
      }
      header {
        margin-bottom: 18px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      .meta {
        color: var(--muted);
        font-size: 0.92rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 12px 4px;
        box-shadow: 0 2px 8px rgba(22, 28, 45, 0.06);
      }
      .card h2 {
        margin: 0 0 8px;
        font-size: 0.96rem;
        text-transform: capitalize;
      }
      .chart-wrap {
        height: 260px;
      }
      footer {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      @media (max-width: 640px) {
        body { padding: 12px; }
        .grid { grid-template-columns: 1fr; }
        .chart-wrap { height: 220px; }
      }
    </style>

rify new AUv3 features and settings.\n- Updated PluginPage.tsx to handle host context changes and display standalone app settings.\n- Improved auv3Bridge.ts to suppress nonessential polling RPCs when the AUv3 host is inactive.\n\n* feat: implement binary scope frame encoding and decoding, enhance AUv3 scope transport\n\n* feat: enhance AUv3 webview handling with reload policy and state management\n\n* feat: Implement WebEditorSession for enhanced web view management\n\n- Added WebEditorSession.swift to manage web view lifecycle and communication.\n- Introduced WebEditorHostContext to encapsulate runtime and fit modes.\n- Enhanced WebViewScriptDispatcher to handle IPC responses and manage pending messages.\n- Updated tests to cover new IPC response handling and lifecycle management.\n- Modified auv3Bridge.ts to improve visibility lifecycle and scope polling behavior.\n- Ensured proper integration of standalone app settings and context publishing in the web view.\n\n* fix typo\n\n* fix(auv3): stabilize telemetry demand tracking\n\n* refactor(auv3): move standalone settings out of fixes branch\n\n* lint","timestamp":"2026-07-07T12:32:42Z","url":"https://github.com/fpbrault/cosmo-pd/commit/8eb1ffdbd8c2cab4b24bc7694913e03973d9e23a","committer":"web-flow"},{"id":"2984356f2bc5a1198dcf08c35533b9ca51e7c4e2","message":"feat(auv3): add standalone app settings (#337)","timestamp":"2026-07-07T08:55:22-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/2984356f2bc5a1198dcf08c35533b9ca51e7c4e2","committer":"web-flow"}],"charts":[{"name":"chants_like","unit":"ns/iter","variants":[{"name":"3 voices","values":[10351402,10467929,10561295,10518465,9868908,10327276,10180322,10404622,10430616,9939618,10399548,10232752,10235537,10338556,10665773,10569173,10381655,10472377,10207633,7942523],"ranges":["± 41380","± 64332","± 37293","± 46103","± 194906","± 29804","± 46322","± 35458","± 24023","± 52012","± 148287","± 151997","± 27705","± 22035","± 49777","± 71500","± 129467","± 130768",       const palette = [
        "#3b82f6", "#8b5cf6", "#ec4899", "#14b8a6", "#f97316", "#22c55e", "#ef4444", "#64748b"
      ];

      const chartArea = document.getElementById("charts");
      document.getElementById("meta").textContent =
        payload.repo + " | " + payload.benchmarkName + " | updated " + new Date(payload.lastUpdate).toLocaleString();

      payload.charts.forEach((group) => {
        const card = document.createElement("section");
        card.className = "card";
        const title = document.createElement("h2");
        title.textContent = group.name.replace(/_/g, " ");
        const wrap = document.createElement("div");
        wrap.className = "chart-wrap";
        const canvas = document.createElement("canvas");
        wrap.appendChild(canvas);
        card.appendChild(title);
        card.appendChild(wrap);
        chartArea.appendChild(card);

        const datasets = group.variants.map((variant, i) => ({
          label: variant.name,
          data: variant.values,
          spanGaps: true,
          borderColor: palette[i % palette.length],
          backgroundColor: palette[i % palette.length],
          borderWidth: 2,
          pointRadius: 2,
          pointHoverRadius: 5,
          tension: 0.2,
          metaRanges: variant.ranges,
          metaExtras: variant.extras,
        }));

        new Chart(canvas, {
          type: "line",
          data: {
            labels: payload.commitLabels,
            datasets,
          },
          options: {
            maintainAspectRatio: false,
            interaction: { mode: "nearest", intersect: false },
            plugins: {
              legend: { position: "top" },
              tooltip: {
                callbacks: {
                  title(items) {
                    const item = items[0];
                    const detail = payload.commitDetails[item.dataIndex];
                    return detail.id.slice(0, 7) + " - " + detail.timestamp;
                  },
                  afterTitle(items) {
                    const detail = payload.commitDetails[items[0].dataIndex];
                    return detail.message;
                  },
                  label(ctx) {
                    const value = ctx.parsed.y;
                    if (value == null) {
                      return ctx.dataset.label + ": no data";
                    }
                    const range = ctx.dataset.metaRanges?.[ctx.dataIndex] || "";
                    return ctx.dataset.label + ": " + Number(value).toLocaleString() + " " + group.unit + (range ? " (" + range + ")" : "");
                  },
                  afterLabel(ctx) {
                    return ctx.dataset.metaExtras?.[ctx.dataIndex] || "";
                  },
                },
              },
            },
            scales: {
              x: {
                title: { display: true, text: "Commit" },
                ticks: { maxRotation: 45, minRotation: 45 },
              },
              y: {
                title: { display: true, text: group.unit },
                beginAtZero: true,
              },
            },
            onClick(_event, elements) {
              if (!elements.length) {
                return;
              }
              const idx = elements[0].index;
              const url = payload.commitDetails[idx]?.url;
              if (url) {
                window.open(url, "_blank", "noopener");
              }
            },
          },
        });
