ndle, PresetBankMetadata, PresetBankEntry DTOs\n- Plugin crate re-exports from bridge-types via session_state.rs,\n  preset_library.rs, runtime_state.rs\n- Fix BigInt types (u64→u32, i64→f64) for specta-typescript compat\n- Exclude preset types with serde_json::Value from specta export\n- Regenerate plugin-bridge.ts with 13 typed exports + PluginIpcMethods\n\n* feat(bridge): add typed IPC variants for editor, midi learn, scope, transport\n\n- Add GetEditorState/SetEditorState, GetMidiLearnState, GetScopeData,\n  GetTransportInfo, GetPresetSession variants to PluginIpcRequest\n- Update PluginIpcMethods contract with typed request/response pairs\n- Regenerate plugin-bridge.ts — 9 typed IPC variants, 9 methods\n- 845 JS + 194 Rust tests pass\n\n* feat(bridge): wire typed IPC through TS bridge\n\nExport bridge types from @cosmo/cosmo-pd101, replace local type aliases\nin IPCBridge.ts and auv3Bridge.ts with proper imports. __czSetEditorState\nnow takes EditorState directly (no JSON parse roundtrip). useSessionStateSync\nuses EditorState type instead of unknown casts.\n\n* feat(bridge): migrate Rust IPC dispatch to typed PluginIpcRequest enum\n\nReplace string-matching dispatch with typed enum matching via\nfrom_legacy() converter. Rewrite all 5 IPC sub-handlers to match\non enum variants. Update IPC coverage test to scan bridge-types\nipc.rs and handle pipe-separated method patterns.\n\n* feat(plugin-ipc-bridge-types): Phase 4 — typed invoke wrappers, consolidated Window types\n\n- Create ipcTypes.ts with shared IpcRpcResponse, PresetSession, Window interface, createTypedInvoke factory\n- Refactor IPCBridge.ts: replace raw invokeRust with typed invoke() constrained by PluginIpcMethods\n- Refactor auv3Bridge.ts: use typed invoke() for router calls, keep invokeAuv3 for subscription/timeout-sensitive calls\n- Remove AUv3-specific Window decls from shared ipcTypes.ts (hosted in auv3Bridge.ts only)\n- Drop redundant Rust coverage section from ipcCoverage.test.ts (compiler-enf         const wrap = document.createElement("div");
        wrap.className = "chart-wrap";
        const canvas = document.createElement("canvas");
        wrap.appendChild(canvas);
        card.appendChild(title);
        card.appendChild(wrap);
        chartArea.appendChild(card);

        const datasets = group.variants.map((variant, i) => ({
          label: variant.name,
          data: variant.values,
          spanGaps: true,
          borderColor: palette[i % palette.length],
          backgroundColor: palette[i % palette.length],
          borderWidth: 2,
          pointRadius: 2,
          pointHoverRadius: 5,
          tension: 0.2,
          metaRanges: variant.ranges,
          metaExtras: variant.extras,
        }));

        new Chart(canvas, {
          type: "line",
          data: {
            labels: payload.commitLabels,
            datasets,
          },
          options: {
            maintainAspectRatio: false,
            interaction: { mode: "nearest", intersect: false },
            plugins: {
              legend: { position: "top" },
              tooltip: {
                callbacks: {
                  title(items) {
                    const item = items[0];
                    const detail = payload.commitDetails[item.dataIndex];
                    return detail.id.slice(0, 7) + " - " + detail.timestamp;
                  },
                  afterTitle(items) {
                    const detail = payload.commitDetails[items[0].dataIndex];
                    return detail.message;
                  },
                  label(ctx) {
                    const value = ctx.parsed.y;
                    if (value == null) {
                      return ctx.dataset.label + ": no data";
                    }
                    const range = ctx.dataset.metaRanges?.[ctx.dataIndex] || "";
                    return ctx.dataset.label + ": " + Number(value).toLocaleString() + " " + group.unit + (range ? " (" + range + ")" : "");
                  },
                  afterLabel(ctx) {
                    return ctx.dataset.metaExtras?.[ctx.dataIndex] || "";
                  },
                },
              },
            },
            scales: {
              x: {
                title: { display: true, text: "Commit" },
                ticks: { maxRotation: 45, minRotation: 45 },
              },
              y: {
                title: { display: true, text: group.unit },
                beginAtZero: true,
              },
            },
            onClick(_event, elements) {
              if (!elements.length) {
                return;
              }
              const idx = elements[0].index;
              const url = payload.commitDetails[idx]?.url;
              if (url) {
                window.open(url, "_blank", "noopener");
              }
            },
          },
        });
      });
    </script>
  </body>
</html>
