tored modulation logic to conditionally apply modulations based on active routes, improving performance.\n- Enhanced voice rendering functions to utilize compiled line plans, optimizing audio output.\n- Added tests to validate rendering behavior with and without modulation, ensuring audio integrity.\n- Minor adjustments to SIMD operations for improved clarity and maintainability.\n\n* refactor(engine): rename RenderPlan to CompiledSynthParams\n\n* linting\n\n* chore: remove unused filter parameters from ENGINE_PARAM_UI_META_V1\n\n* test: add unit test for FX slot changes synchronization in CosmoProcessor\nrefactor: update DCO exponential curve comment for clarity\n\n* chore: update cosmo_synth_engine_bg.wasm binary file","timestamp":"2026-05-17T10:52:06-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/86a33a6c6950d129d6961cbf76839f1c7aded53b","committer":"web-flow"},{"id":"c91e9c169e95b59983c9ec8922baaece7db95b72","message":"feat: add CZ DAC emulation and enhance synth parameters (#187)\n\n* chore: remove unused filter parameters and related code\n\n* fix tests\n\n* chore: refactor SIMD backend dispatch to reduce code duplication\n\n* feat: Enhance rendering and modulation capabilities in Cosmo Synth Engine\n\n- Introduced `from_compiled_line` method in `LineRenderConfig` to streamline line rendering using compiled plans.\n- Updated `CosmoProcessor` to manage a `RenderPlan`, ensuring efficient rendering and modulation handling.\n- Refactored modulation logic to conditionally apply modulations based on active routes, improving performance.\n- Enhanced voice rendering functions to utilize compiled line plans, optimizing audio output.\n- Added tests to validate rendering behavior with and without modulation, ensuring audio integrity.\n- Minor adjustments to SIMD operations for improved clarity and maintainability.\n\n* refactor(engine): rename RenderPlan to CompiledSynthParams\n\n* linting\n\n* chore: remove unused filter parameters from ENGINE_PARAM_UI_META_V1\n\n* test: add unit test for FX slot changes synchronization in CosmoProcessor\nrefactor: update DCO exponential curve comment for clarity\n\n* chore: update cosmo_synth_engine_bg.wasm binary file\n\n* feat: add CZ DAC emulation and enhance synth parameters\n\n- Introduced `CzDacColor` struct for DAC coloration effect, implementing processing logic for CZ-1 emulation.\n- Updated `SynthParams` to include `czDacEnabled` flag, allowing toggling of the CZ DAC effect.\n- Refactored voice rendering to utilize a new `VoiceRenderContext` struct, simplifying parameter passing.\n- Enhanced LFO processing by consolidating related logic into a dedicated function.\n- Improved overall code organization and readability by separating concerns and reducing argument counts in functions.","timestamp":"2026-05-17T11:05:05-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/c91e9c169e95b59983c9ec8922baaece7db95b72","committer":"web-flow"},{"id":"5237d0c9be691c3cd4322ad078a4708f55faa929","message":"fix: add missing bench configuration for render-bench","timestamp":"2026-05-17T12:20:43-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/5237d0c9be691c3cd4322ad078a4708f55faa929","committer":"fpbrault"},{"id":"59d922d644606ee590c1584f65bb270e2046a7b4","message":"fix charts","timestamp":"2026-05-17T12:41:03-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/59d922d644606ee590c1584f65bb270e2046a7b4","committer":"fpbrault"},{"id":"828c25f86a4bff5bc23fc89c96e31ae921e56667","message":"chore: migrate from nih-plug to truce (#185)\n\n* feat: migrate from nih-plug to truce.audio (CLAP/VST3)\n\nRewrite lib.rs with truce #[derive(Params)] for\n26 DAW-automatable FloatParams and PluginLogic trait\nimpl. Rewrite gui.rs with truce Editor trait keeping\nwry WebView. Update Cargo.toml deps. Remove dead code.\nAll 14 tests pass, 0 warnings.\n\n* chore: clean up build scripts after nih-plug -> truce migration\n\nRemove macOS AUv3 Xcode build path from build-plugin-auv3.mjs\n(keep iOS XC d factory preset count and parameters retrieval functions; refactor LFO module for cleaner code\n\n* linting\n\n* linting","timestamp":"2026-05-18T13:09:42Z","url":"https://github.com/fpbrault/cosmo-pd/commit/785e48c77bda2770610e3889ace76baa4ccb63b1","committer":"web-flow"},{"id":"711a6e2c3ab699f29c47e78aff90ad0ec42c0e07","message":"fix(engine): notes getting stuck with duplicate events (#203)\n\n* feat: Add tempo and LFO sync features to synth engine\n\n- Introduced `tempoBpm` parameter to control manual tempo for BPM-synced modulation.\n- Added `LfoRateMode` and `LfoSyncDivision` types to manage LFO rate modes and sync divisions.\n- Updated `SynthState` and `SynthActions` to include tempo and LFO settings.\n- Enhanced `CosmoProcessor` to handle host transport timing for LFO synchronization.\n- Implemented tests to verify LFO behavior with manual and host transport tempos.\n- Updated UI metadata and localization for new parameters.\n\n* feat: Add factory preset count and parameters retrieval functions; refactor LFO module for cleaner code\n\n* fix: enhance factory preset handling and MIDI event processing\n\n* fix: improve transport state handling and note processing in synthesizer\n\n* fix: remove unnecessary log statements and improve LFO module functionality\n\n* linting\n\n* linting","timestamp":"2026-05-18T13:20:29Z","url":"https://github.com/fpbrault/cosmo-pd/commit/711a6e2c3ab699f29c47e78aff90ad0ec42c0e07","committer":"web-flow"},{"id":"7a3c239bb37f85ad6d16833b26c1952bca0f0b26","message":"chore(deps): update actions/cache action to v5 (#198)\n\nCo-authored-by: renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>","timestamp":"2026-05-18T10:23:08-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/7a3c239bb37f85ad6d16833b26c1952bca0f0b26","committer":"web-flow"},{"id":"a24fa5c20a8ac23c53b3b9ba530f2b70ee78f3e0","message":"feat(synth): add 4 macro knobs with per-parameter modulation assignments (#199)\n\n* feat(synth): add 4 macro knobs with pe       const palette = [
        "#3b82f6", "#8b5cf6", "#ec4899", "#14b8a6", "#f97316", "#22c55e", "#ef4444", "#64748b"
      ];

      const chartArea = document.getElementById("charts");
      document.getElementById("meta").textContent =
        payload.repo + " | " + payload.benchmarkName + " | updated " + new Date(payload.lastUpdate).toLocaleString();

      payload.charts.forEach((group) => {
        const card = document.createElement("section");
        card.className = "card";
        const title = document.createElement("h2");
        title.textContent = group.name.replace(/_/g, " ");
        const wrap = document.createElement("div");
        wrap.className = "chart-wrap";
        const canvas = document.createElement("canvas");
        wrap.appendChild(canvas);
        card.appendChild(title);
        card.appendChild(wrap);
        chartArea.appendChild(card);

        const datasets = group.variants.map((variant, i) => ({
          label: variant.name,
          data: variant.values,
          spanGaps: true,
          borderColor: palette[i % palette.length],
          backgroundColor: palette[i % palette.length],
          borderWidth: 2,
          pointRadius: 2,
          pointHoverRadius: 5,
          tension: 0.2,
          metaRanges: variant.ranges,
          metaExtras: variant.extras,
        }));

        new Chart(canvas, {
          type: "line",
          data: {
            labels: payload.commitLabels,
            datasets,
          },
          options: {
            maintainAspectRatio: false,
            interaction: { mode: "nearest", intersect: false },
            plugins: {
              legend: { position: "top" },
              tooltip: {
                callbacks: {
                  title(items) {
                    const item = items[0];
                    const detail = payload.commitDetails[item.dataIndex];
                    return detail.id.slice(0, 7) + " - " + detail.timestamp;
                  },
                  afterTitle(items) {
                    const detail = payload.commitDetails[items[0].dataIndex];
                    return detail.message;
                  },
                  label(ctx) {
                    const value = ctx.parsed.y;
                    if (value == null) {
                      return ctx.dataset.label + ": no data";
                    }
                    const range = ctx.dataset.metaRanges?.[ctx.dataIndex] || "";
                    return ctx.dataset.label + ": " + Number(value).toLocaleString() + " " + group.unit + (range ? " (" + range + ")" : "");
                  },
                  afterLabel(ctx) {
                    return ctx.dataset.metaExtras?.[ctx.dataIndex] || "";
                  },
                },
              },
            },
            scales: {
              x: {
                title: { display: true, text: "Commit" },
                ticks: { maxRotation: 45, minRotation: 45 },
              },
              y: {
                title: { display: true, text: group.unit },
                beginAtZero: true,
              },
            },
            onClick(_event, elements) {
              if (!elements.length) {
                return;
              }
              const idx = elements[0].index;
              const url = payload.commitDetails[idx]?.url;
              if (url) {
                window.open(url, "_blank", "noopener");
              }
            },
          },
        });
      });
