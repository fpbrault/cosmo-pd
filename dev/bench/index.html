tEnabled` options in `useNoteHandling` to control input handling.\n- Created `synthRuntime.ts` to define types for synth runtime, including performance metrics and note handling.\n- Updated `index.ts` to export new runtime types.\n- Cleaned up factory presets by consolidating tag arrays for better readability.\n\n* fix(plugin): sync DAW automation params to webview GUI\n\n* refactor(plugin): replace MidiMapping with MidiLearnState types in session state\n\n* feat(plugin): move MIDI learn authority from JS to Rust engine\n\n- Replace MidiMapping with MidiLearnBinding/MidiLearnState types\n- Remove setMidiMappings/getMidiMappings IPC handlers\n- Add setMidiLearnMode, setPendingMidiLearnParam, addMidiBinding,\n  removeMidiBinding, clearMidiLearnBindings, getMidiLearnState\n- Rewrite handle_host_event catch-all for learn capture + apply\n- Add version-tracked idle push of MidiLearnState via __czOnMidiLearnState\n\n* refactor(plugin): update MIDI learn bridge methods in IPC and AUv3\n\n* refactor(plugin,ui): move MIDI learn authority to Rust engine and update JS store\n\n* fix(ui): update MidiLearnPanel for engine-based MIDI learn store\n\n* fix(plugin): restore default MIDI learn bindings\n\n* Enhance MIDI Learning Functionality and Update Preset Tags\n\n- Introduced a new type `MidiBindingIdentity` for better binding management.\n- Updated `removeBinding` method to accept `MidiBindingIdentity` instead of just `paramKey`.\n- Implemented `bindingMatches` function to streamline binding comparisons.\n- Added `refreshMidiLearnState` function to fetch and initialize MIDI learn state from the engine.\n- Enhanced `subscribeMidiLearnState` to call `refreshMidiLearnState` on subscription.\n- Reformatted preset tags in `FACTORY_CZ_PRESETS` for consistency and readability.\n\n* feat(global-settings): implement global MIDI learn bindings management\n\n* Add MIDI mapping and input event handling to the synth engine\n\n- Introduced `mapping.rs` to manage MIDI parameter bindings and automation.\n- Implemented functions for setting parameter values, retrieving parameter ranges, and applying MIDI mappings.\n- Created `input.rs` to handle various input events including note on/off, control changes, and transport state.\n- Updated `CosmoProcessor` to integrate input event processing and transport state management.\n- Added tests for MIDI mapping functionality to ensure correct parameter application.\n\n* Refactor factory CZ presets to simplify tag formatting\n\n- Consolidated tag arrays into single-line format for better readability in `factoryCzPresets.ts`.\n- Updated parameter range retrieval logic in `mapping.rs` for improved clarity.\n- Reorganized module imports in `mod.rs` for consistency.\n- Enhanced input event handling in `input.rs` to support parameter changes.\n- Fixed missing newline at the end of `build.rs` for proper formatting.\n\n* Refactor code structure for improved readability and maintainability\n\n* feat(preset-library): enhance favorite management and schema versioning\n\n* Refactor synth preset manager and related tests\n\n- Updated `useSynthPresetManager` to manage preset dirty states more effectively using a new state variable `isPresetDirty`.\n- Removed unused code and tests related to pending preset changes.\n- Simplified preset selection handling by introducing a `commitPresetSelection` function.\n- Adjusted the handling of preset sessions to store a boolean `isDirty` instead of a fingerprint.\n- Updated tests for `useSynthPresetManager` to reflect changes in state management and preset handling.\n- Removed deprecated test file `useSynthPresetManager.test.tsx`.\n- Modified `presetStorage` to accommodate the new `isDirty` state in the current preset session.\n\n* Refactor code structure for improved readability and maintainability\n\n* fix sorting order\n\n* refactor: remove legacy plans and documentation for MIDI learn and preset management\n\n- Deleted PLAN.md, PREDESIGN.md, and SYNTH_RUNTIME_REFACTOR_PLAN.md as they are         "#3b82f6", "#8b5cf6", "#ec4899", "#14b8a6", "#f97316", "#22c55e", "#ef4444", "#64748b"
      ];

      const chartArea = document.getElementById("charts");
      document.getElementById("meta").textContent =
        payload.repo + " | " + payload.benchmarkName + " | updated " + new Date(payload.lastUpdate).toLocaleString();

      payload.charts.forEach((group) => {
        const card = document.createElement("section");
        card.className = "card";
        const title = document.createElement("h2");
        title.textContent = group.name.replace(/_/g, " ");
        const wrap = document.createElement("div");
        wrap.className = "chart-wrap";
        const canvas = document.createElement("canvas");
        wrap.appendChild(canvas);
        card.appendChild(title);
        card.appendChild(wrap);
        chartArea.appendChild(card);

        const datasets = group.variants.map((variant, i) => ({
          label: variant.name,
          data: variant.values,
          spanGaps: true,
          borderColor: palette[i % palette.length],
          backgroundColor: palette[i % palette.length],
          borderWidth: 2,
          pointRadius: 2,
          pointHoverRadius: 5,
          tension: 0.2,
          metaRanges: variant.ranges,
          metaExtras: variant.extras,
        }));

        new Chart(canvas, {
          type: "line",
          data: {
            labels: payload.commitLabels,
            datasets,
          },
          options: {
            maintainAspectRatio: false,
            interaction: { mode: "nearest", intersect: false },
            plugins: {
              legend: { position: "top" },
              tooltip: {
                callbacks: {
                  title(items) {
                    const item = items[0];
                    const detail = payload.commitDetails[item.dataIndex];
                    return detail.id.slice(0, 7) + " - " + detail.timestamp;
                  },
                  afterTitle(items) {
                    const detail = payload.commitDetails[items[0].dataIndex];
                    return detail.message;
                  },
                  label(ctx) {
                    const value = ctx.parsed.y;
                    if (value == null) {
                      return ctx.dataset.label + ": no data";
                    }
                    const range = ctx.dataset.metaRanges?.[ctx.dataIndex] || "";
                    return ctx.dataset.label + ": " + Number(value).toLocaleString() + " " + group.unit + (range ? " (" + range + ")" : "");
                  },
                  afterLabel(ctx) {
                    return ctx.dataset.metaExtras?.[ctx.dataIndex] || "";
                  },
                },
              },
            },
            scales: {
              x: {
                title: { display: true, text: "Commit" },
                ticks: { maxRotation: 45, minRotation: 45 },
              },
              y: {
                title: { display: true, text: group.unit },
                beginAtZero: true,
              },
            },
            onClick(_event, elements) {
              if (!elements.length) {
                return;
              }
              const idx = elements[0].index;
              const url = payload.commitDetails[idx]?.url;
              if (url) {
                window.open(url, "_blank", "noopener");
              }
            },
          },
