    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fc;
        --panel: #ffffff;

        --muted: #566174;
        --border: #d5ddea;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        font-family: "Segoe UI", "Inter", sans-serif;
        background: radial-gradient(circle at top right, #ebf0ff 0%, var(--bg) 40%);
        color: var(--text);
      }
      header {
        margin-bottom: 18px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      .meta {
        color: var(--muted);
        font-size: 0.92rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 12px 4px;
        box-shadow: 0 2px 8px rgba(22, 28, 45, 0.06);
      }
      .card h2 {
        margin: 0 0 8px;
        font-size: 0.96rem;
        text-transform: capitalize;
      }
      .chart-wrap {
        height: 260px;
      }
      footer {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      @media (max-width: 640px) {
        body { padding: 12px; }
        .grid { grid-template-columns: 1fr; }
        .chart-wrap { height: 220px; }
      }
    </style>

ettings asynchronously.\n- Implemented command queue in the Rust FFI for handling audio engine commands.\n- Enhanced rendering functions to prevent concurrent access and ensure thread safety.\n- Updated tests to validate engine retention and concurrent command execution.\n- Modified runtime voice debug state handling to improve performance and memory management.\n- Updated WASM binaries for the synth engine.\n\n* feat: implement Auv3HostedScrollbar for improved scrolling experience in hosted AUv3 content\n\n- Added Auv3HostedScrollbar component to manage custom scrollbar behavior for hosted AUv3 content.\n- Updated PluginPage to integrate Auv3HostedScrollbar and adjust layout for hosted environments.\n- Modified CSS to support touch actions and gesture controls for hosted AUv3.\n- Enhanced tests for PluginPage to validate new scrollbar behavior and layout adjustments.\n- Introduced hosted gesture utilities to handle touch interactions more effectively.\n- Updated various components to support gesture controls and improve user interaction in hosted environments.\n\n* feat: remove gesture control attributes and related gesture handling logic for AUv3 components\n\n* cleanup","timestamp":"2026-07-21T14:46:18Z","url":"https://github.com/fpbrault/cosmo-pd/commit/e42aff209f8966cd296a9c3cca22032f54282c2f","committer":"web-flow"},{"id":"9acb0ea695aa9532312572e01cf6d30c737b4e73","message":"fix(plugin): make runtime telemetry RT-safe (#343)\n\n* fix(plugin): make runtime telemetry RT-safe\n\n* feat: add scope frame subscription management to usePluginSynthRuntime\n\n* feat: add test for scope delivery persistence across display, fx, and mod switches","timestamp":"2026-07-21T14:30:37-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/9acb0ea695aa9532312572e01cf6d30c737b4e73","committer":"web-flow"},{"id":"9acb0ea695aa9532312572e01cf6d30c737b4e73","message":"fix(plugin): make runtime telemetry RT-safe (#343)\n\n* fix(plugin): make runtime telemetry RT-safe\n\n* feat: add       const palette = [
        "#3b82f6", "#8b5cf6", "#ec4899", "#14b8a6", "#f97316", "#22c55e", "#ef4444", "#64748b"
      ];

      const chartArea = document.getElementById("charts");
      document.getElementById("meta").textContent =
        payload.repo + " | " + payload.benchmarkName + " | updated " + new Date(payload.lastUpdate).toLocaleString();

      payload.charts.forEach((group) => {
        const card = document.createElement("section");
        card.className = "card";
        const title = document.createElement("h2");
        title.textContent = group.name.replace(/_/g, " ");
        const wrap = document.createElement("div");
        wrap.className = "chart-wrap";
        const canvas = document.createElement("canvas");
        wrap.appendChild(canvas);
        card.appendChild(title);
        card.appendChild(wrap);
        chartArea.appendChild(card);

        const datasets = group.variants.map((variant, i) => ({
          label: variant.name,
          data: variant.values,
          spanGaps: true,
          borderColor: palette[i % palette.length],
          backgroundColor: palette[i % palette.length],
          borderWidth: 2,
          pointRadius: 2,
          pointHoverRadius: 5,
          tension: 0.2,
          metaRanges: variant.ranges,
          metaExtras: variant.extras,
        }));

        new Chart(canvas, {
          type: "line",
          data: {
            labels: payload.commitLabels,
            datasets,
          },
          options: {
            maintainAspectRatio: false,
            interaction: { mode: "nearest", intersect: false },
            plugins: {
              legend: { position: "top" },
              tooltip: {
                callbacks: {
                  title(items) {
                    const item = items[0];
                    const detail = payload.commitDetails[item.dataIndex];
                    return detail.id.slice(0, 7) + " - " + detail.timestamp;
                  },
                  afterTitle(items) {
                    const detail = payload.commitDetails[items[0].dataIndex];
                    return detail.message;
                  },
                  label(ctx) {
                    const value = ctx.parsed.y;
                    if (value == null) {
                      return ctx.dataset.label + ": no data";
                    }
                    const range = ctx.dataset.metaRanges?.[ctx.dataIndex] || "";
                    return ctx.dataset.label + ": " + Number(value).toLocaleString() + " " + group.unit + (range ? " (" + range + ")" : "");
                  },
                  afterLabel(ctx) {
                    return ctx.dataset.metaExtras?.[ctx.dataIndex] || "";
                  },
                },
              },
            },
            scales: {
              x: {
                title: { display: true, text: "Commit" },
                ticks: { maxRotation: 45, minRotation: 45 },
              },
              y: {
                title: { display: true, text: group.unit },
                beginAtZero: true,
              },
            },
            onClick(_event, elements) {
              if (!elements.length) {
                return;
              }
              const idx = elements[0].index;
              const url = payload.commitDetails[idx]?.url;
              if (url) {
                window.open(url, "_blank", "noopener");
              }
            },
          },
        });
