12Z","url":"https://github.com/fpbrault/cosmo-pd/commit/9ee8fd233074a4b829fe8eed32991f4432afe8f6","committer":"web-flow"},{"id":"e7dc646fa9583b42e002c37c4716befb7f9bd67a","message":"feat: move presets to engine (#259)\n\n* feat: integrate runtime voice states into IPC and GUI components\n\n* Refactor code structure and remove redundant sections for improved readability and maintainability\n\n* Refactor code structure for improved readability and maintainability\n\n* Enhance session state synchronization and improve preset tag formatting\n\n- Refactored `subscribeEditorState` and `subscribeMidiMappings` functions in `useSessionStateSync.ts` to improve state management and reduce redundancy.\n- Added initial state push for editor and MIDI mappings upon subscription.\n- Reformatted tags in `factoryCzPresets.ts` to use array syntax for consistency and readability.\n\n* feat: enhance MIDI and note handling with new options and runtime types\n\n- Added `applyBindings` option to `useMidiLearnBindings` for conditional binding application.\n- Introduced `keyboardInputEnabled` and `midiInputEnabled` options in `useNoteHandling` to control input handling.\n- Created `synthRuntime.ts` to define types for synth runtime, including performance metrics and note handling.\n- Updated `index.ts` to export new runtime types.\n- Cleaned up factory presets by consolidating tag arrays for better readability.\n\n* fix(plugin): sync DAW automation params to webview GUI\n\n* refactor(plugin): replace MidiMapping with MidiLearnState types in session state\n\n* feat(plugin): move MIDI learn authority from JS to Rust engine\n\n- Replace MidiMapping with MidiLearnBinding/MidiLearnState types\n- Remove setMidiMappings/getMidiMappings IPC handlers\n- Add setMidiLearnMode, setPendingMidiLearnParam, addMidiBinding,\n  removeMidiBinding, clearMidiLearnBindings, getMidiLearnState\n- Rewrite handle_host_event catch-all for learn capture + apply\n- Add version-tracked idle push of MidiLearnState via __czOnMidiLearnState\n\n* refactor(plugin): update MIDI learn bridge methods in IPC and AUv3\n\n* refactor(plugin,ui): move MIDI learn authority to Rust engine and update JS store\n\n* fix(ui): update MidiLearnPanel for engine-based MIDI learn store\n\n* fix(plugin): restore default MIDI learn bindings\n\n* Enhance MIDI Learning Functionality and Update Preset Tags\n\n- Introduced a new type `MidiBindingIdentity` for better binding management.\n- Updated `removeBinding` method to accept `MidiBindingIdentity` instead of just `paramKey`.\n- Implemented `bindingMatches` function to streamline binding comparisons.\n- Added `refreshMidiLearnState` function to fetch and initialize MIDI learn state from the engine.\n- Enhanced `subscribeMidiLearnState` to call `refreshMidiLearnState` on subscription.\n- Reformatted preset tags in `FACTORY_CZ_PRESETS` for consistency and readability.\n\n* feat(global-settings): implement global MIDI learn bindings management\n\n* Add MIDI mapping and input event handling to the synth engine\n\n- Introduced `mapping.rs` to manage MIDI parameter bindings and automation.\n- Implemented functions for setting parameter values, retrieving parameter ranges, and applying MIDI mappings.\n- Created `input.rs` to handle various input events including note on/off, control changes, and transport state.\n- Updated `CosmoProcessor` to integrate input event processing and transport state management.\n- Added tests for MIDI mapping functionality to ensure correct parameter application.\n\n* Refactor factory CZ presets to simplify tag formatting\n\n- Consolidated tag arrays into single-line format for better readability in `factoryCzPresets.ts`.\n- Updated parameter range retrieval logic in `mapping.rs` for improved clarity.\n- Reorganized module imports in `mod.rs` for consistency.\n- Enhanced input event handling in `input.rs` to support parameter changes.\n- Fixed missing newline at the end of `build.rs` for proper formatting.\n\n* Refactor code structure for improved readability and maintainability\n\n* feat(preset-library): enhance favorite management and schema versioning\n\n* Refactor synth preset manager and related tests\n\n- Updated `useSynthPresetManager` to manage preset dirty states more effectively using a new state variable `isPresetDirty`.\n- Removed unused code and tests related to pending preset changes.\n- Simplified preset selection handling by introducing a `commitPresetSelection` function.\n- Adjusted the handling of preset sessions to store a boolean `isDirty` instead of a fingerprint.\n- Updated tests for `useSynthPresetManager` to reflect changes in state management and preset handling.\n- Removed deprecated test file `useSynthPresetManager.test.tsx`.\n- Modified `presetStorage` to accommodate the new `isDirty` state in the current preset session.\n\n* Refactor code structure for improved readability and maintainability\n\n* fix sorting order\n\n* refactor: remove legacy plans and documentation for MIDI learn and preset management\n\n- Deleted PLAN.md, PREDESIGN.md, and SYNTH_RUNTIME_REFACTOR_PLAN.md as they are no longer relevant to the current architecture and implementation strategy.\n- These documents contained outdated information regarding MIDI learn refactor, DAW to webview synchronization, and preset ownership which have been superseded by new designs and implementations.\n\n* removed lv2/vst2/aax for now\n\n* feat: add factory preset code generation functionality\n\n- Implemented `factory_preset_codegen.rs` to handle loading, validating, and generating factory presets.\n- Introduced a new main entry point in `main.rs` to execute the preset generation process.\n- Updated `package.json` to change the command for generating factory presets to use the new module.\n\n* linting\n\n* feat: enhance preset session handling and improve mock bridge tests","timestamp":"2026-06-04T01:04:08Z","url":"https://github.com/fpbrault/cosmo-pd/commit/e7dc646fa9583b42e002c37c4716befb7f9bd67a","committer":"web-flow"},{"id":"7520172bdd07cca65eb6d139b206eb4b2e228a9d","message":"refactor: streamline preset management by introducing a new repositor… (#262)\n\n* refactor: streamline preset management by introducing a new repository pattern\n\n- Consolidated preset management logic into a dedicated repository interface.\n- Removed unused imports and functions related to local and library presets.\n- Updated the useSynthPresetManager hook to utilize the new repository for operations.\n- Enhanced preset activation and navigation handling.\n- Improved state management for active presets and navigation entries.\n- Added new types for better type safety and clarity in preset management.\n\n* fix logging and preset nav state restore\n\n* fix tests","timestamp":"2026-06-04T14:07:55Z","url":"https://github.com/fpbrault/cosmo-pd/commit/7520172bdd07cca65eb6d139b206eb4b2e228a9d","committer":"web-flow"},{"id":"7c4f4c24b57209faf70c9672ec983e025cc99a57","message":"refactor: remove benchmark API and related perf monitor files (#263)\n\nRefactor performance monitoring: remove benchmark API and related components\n\n- Removed the PerformanceMonitor component and its associated tests.\n- Eliminated the benchmark-related logic from the SynthRenderer and useWebSynthRuntime hooks.\n- Cleaned up the IPCBridge and PluginPage to remove unused performance metrics functions.\n- Updated the CzSynthWorkletProcessor to stop tracking performance metrics.\n- Removed the benchmark harness and related types from the codebase.\n- Adjusted tests to reflect the removal of performance monitoring functionality.","timestamp":"2026-06-04T14:28:08Z","url":"https://github.com/fpbrault/cosmo-pd/commit/7c4f4c24b57209faf70c9672ec983e025cc99a57","committer":"web-flow"},{"id":"8fe441fa4d0d3d58398c535c994e79fc72596521","message":"feat: enhance keyboard input handling with PC key labels and visibility toggle (#265)","timestamp":"2026-06-05T09:19:54-04:00","url":"https://github.com/fpbrault/cosmo-pd/commit/8fe441fa4d0d3d58398c5       const palette = [
        "#3b82f6", "#8b5cf6", "#ec4899", "#14b8a6", "#f97316", "#22c55e", "#ef4444", "#64748b"
      ];

      const chartArea = document.getElementById("charts");
      document.getElementById("meta").textContent =
        payload.repo + " | " + payload.benchmarkName + " | updated " + new Date(payload.lastUpdate).toLocaleString();

      payload.charts.forEach((group) => {
        const card = document.createElement("section");
        card.className = "card";
        const title = document.createElement("h2");
        title.textContent = group.name.replace(/_/g, " ");
        const wrap = document.createElement("div");
        wrap.className = "chart-wrap";
        const canvas = document.createElement("canvas");
        wrap.appendChild(canvas);
        card.appendChild(title);
        card.appendChild(wrap);
        chartArea.appendChild(card);

        const datasets = group.variants.map((variant, i) => ({
          label: variant.name,
          data: variant.values,
          spanGaps: true,
          borderColor: palette[i % palette.length],
          backgroundColor: palette[i % palette.length],
          borderWidth: 2,
          pointRadius: 2,
          pointHoverRadius: 5,
          tension: 0.2,
          metaRanges: variant.ranges,
          metaExtras: variant.extras,
        }));

        new Chart(canvas, {
          type: "line",
          data: {
            labels: payload.commitLabels,
            datasets,
          },
          options: {
            maintainAspectRatio: false,
            interaction: { mode: "nearest", intersect: false },
            plugins: {
              legend: { position: "top" },
              tooltip: {
                callbacks: {
                  title(items) {
                    const item = items[0];
                    const detail = payload.commitDetails[item.dataIndex];
                    return detail.id.slice(0, 7) + " - " + detail.timestamp;
                  },
                  afterTitle(items) {
                    const detail = payload.commitDetails[items[0].dataIndex];
                    return detail.message;
                  },
                  label(ctx) {
                    const value = ctx.parsed.y;
                    if (value == null) {
                      return ctx.dataset.label + ": no data";
                    }
                    const range = ctx.dataset.metaRanges?.[ctx.dataIndex] || "";
                    return ctx.dataset.label + ": " + Number(value).toLocaleString() + " " + group.unit + (range ? " (" + range + ")" : "");
                  },
                  afterLabel(ctx) {
                    return ctx.dataset.metaExtras?.[ctx.dataIndex] || "";
                  },
                },
              },
            },
            scales: {
              x: {
                title: { display: true, text: "Commit" },
                ticks: { maxRotation: 45, minRotation: 45 },
              },
              y: {
                title: { display: true, text: group.unit },
                beginAtZero: true,
              },
            },
            onClick(_event, elements) {
              if (!elements.length) {
                return;
              }
              const idx = elements[0].index;
              const url = payload.commitDetails[idx]?.url;
              if (url) {
                window.open(url, "_blank", "noopener");
              }
            },
          },
